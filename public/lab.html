/* ==========================================================================
 * THE CLIP LIBRARY
 * ==========================================================================
 * Asked for as "a library of all of the times I said I was thinking... compare them all",
 * from -15s to +15s, every clip overlaid with the average and a time-matched surrogate
 * band. See Analysis.epochLibrary for the baseline reasoning — the short version is that
 * the default subtracts nothing, because on a self-caught mark the seconds just before it
 * are where the effect lives and baselining against them removes it.
 */
let clipFeature = 'calm';
let clipBaseline = 'none';
let clipCategory = null;

function clipFeatureOptions() {
  const usable = sessions.filter((s) => !s.error);
  const keys = new Set();
  for (const s of usable) {
    for (const k of Analysis.seriesKeys(rowsOf(s))) keys.add(k);
  }
  return Array.from(keys).sort();
}

function clipCategories() {
  const counts = {};
  for (const s of sessions.filter((x) => !x.error)) {
    for (const n of s.notes || []) {
      const k = n.transition || n.tapCategory || n.markKind;
      if (k) counts[k] = (counts[k] || 0) + 1;
    }
  }
  return counts;
}

function renderClips() {
  const host = document.getElementById('clips');
  if (!host) return;
  const cats = clipCategories();
  const catKeys = Object.keys(cats).sort();
  if (!catKeys.length) { host.innerHTML = ''; return; }
  const feats = clipFeatureOptions();
  if (!feats.includes(clipFeature)) clipFeature = feats[0] || 'calm';
  if (clipCategory && !catKeys.includes(clipCategory)) clipCategory = null;

  const lib = Analysis.epochLibrary(sessions.filter((s) => !s.error).map((s) => ({
    sessionId: s.sessionId, metrics: rowsOf(s), notes: s.notes,
  })), { feature: clipFeature, category: clipCategory || catKeys[0],
    baseline: clipBaseline });

  const BASELINES = [
    ['none', 'no baseline', 'The within-session z-scored trace, untouched — nothing'
      + ' event-locked is removed'],
    ['far', 'far baseline', 'Subtracts the EARLIEST third of the window, never the seconds'
      + ' next to the mark'],
    ['detrend', 'detrend', 'Removes a straight line per clip — kills drift across the whole'
      + ' window, leaves a short run-up largely intact'],
  ];

  host.innerHTML = `<h2>Clip library</h2>
    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:8px;align-items:center">
        <label>Mark <select id="clipCat">${catKeys.map((k) =>
          `<option value="${esc(k)}"${(clipCategory || catKeys[0]) === k ? ' selected' : ''}>
            ${esc(k)} (${cats[k]})</option>`).join('')}</select></label>
        <label>Signal <select id="clipFeat">${feats.map((k) =>
          `<option value="${esc(k)}"${clipFeature === k ? ' selected' : ''}>${esc(k)}</option>`
        ).join('')}</select></label>
        <label>Baseline <select id="clipBase">${BASELINES.map(([k, label]) =>
          `<option value="${k}"${clipBaseline === k ? ' selected' : ''}>${esc(label)}</option>`
        ).join('')}</select></label>
      </div>
      <div class="note" style="margin-top:8px">
        ${lib.n} clip(s) from −15s to +15s, each thin line one marked moment, the bright line
        their average, the shaded band what ${lib.surrogateN} random windows from the same
        sits produce. <strong>The average leaving the band is the finding; a smooth average
        is not</strong> — averaging any set of windows produces a smooth curve.
        <br>${esc(BASELINES.find(([k]) => k === clipBaseline)[2])}.
        Vertical units are standard deviations of that signal within its own sit.
      </div>
      <canvas id="clipCanvas" width="880" height="300"
        style="width:100%;height:300px;margin-top:12px"></canvas>
      <div class="note">${lib.peak
        ? `The average leaves the band furthest at <strong>${lib.peak.atSec}s</strong>`
          + `${lib.peak.atSec < 0 ? ' — before the mark' : lib.peak.atSec > 0 ? ' — after it' : ' — at the mark'}`
          + `, by ${lib.peak.excess.toFixed(2)} SD. With this many clips that is something to`
          + ' look at, not a result.'
        : 'The average stays inside the band the whole way. With this many clips that is the'
          + ' expected outcome, and it is an answer rather than a failure.'}</div>
    </div>`;

  drawClips(document.getElementById('clipCanvas'), lib);
  const wire = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => { fn(el.value); renderClips(); });
  };
  wire('clipCat', (v) => { clipCategory = v; });
  wire('clipFeat', (v) => { clipFeature = v; });
  wire('clipBase', (v) => { clipBaseline = v; });
}

function drawClips(canvas, lib) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  c.clearRect(0, 0, W, H);
  const pad = { l: 44, r: 12, t: 12, b: 26 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  // Scale from everything that will be drawn, so no clip is silently cut off.
  let lo = Infinity, hi = -Infinity;
  const consider = (v) => { if (v != null && Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
  for (const cl of lib.clips) for (const v of cl.values) consider(v);
  for (const b of lib.band) if (b) { consider(b.lo); consider(b.hi); }
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 1e-9) { lo = -1; hi = 1; }
  const padY = (hi - lo) * 0.06;
  lo -= padY; hi += padY;
  const X = (t) => pad.l + ((t - lib.bins[0]) / (lib.bins[lib.bins.length - 1] - lib.bins[0])) * iw;
  const Y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * ih;

  // The surrogate band first, so everything else reads on top of it.
  c.fillStyle = 'rgba(255,255,255,.10)';
  c.beginPath();
  let started = false;
  lib.bins.forEach((t, i) => {
    const b = lib.band[i];
    if (!b) return;
    if (!started) { c.moveTo(X(t), Y(b.hi)); started = true; } else c.lineTo(X(t), Y(b.hi));
  });
  for (let i = lib.bins.length - 1; i >= 0; i--) {
    const b = lib.band[i];
    if (b) c.lineTo(X(lib.bins[i]), Y(b.lo));
  }
  c.closePath(); c.fill();

  // Zero line and the mark itself, which is the reference the whole picture is about.
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(pad.l, Y(0)); c.lineTo(W - pad.r, Y(0)); c.stroke();
  c.strokeStyle = 'rgba(255,210,120,.55)';
  c.beginPath(); c.moveTo(X(0), pad.t); c.lineTo(X(0), H - pad.b); c.stroke();

  // Every clip, thin. This is the point of the view: an average of twelve windows hides
  // whether it came from twelve similar shapes or one enormous outlier.
  c.lineWidth = 1;
  c.strokeStyle = 'rgba(134,225,255,.20)';
  for (const cl of lib.clips) {
    c.beginPath();
    let on = false;
    cl.values.forEach((v, i) => {
      if (v == null) { on = false; return; }
      const x = X(lib.bins[i]), y = Y(v);
      if (!on) { c.moveTo(x, y); on = true; } else c.lineTo(x, y);
    });
    c.stroke();
  }

  // The average, bright.
  c.strokeStyle = '#86e1ff'; c.lineWidth = 2.5;
  c.beginPath();
  let on2 = false;
  lib.average.forEach((v, i) => {
    if (v == null) { on2 = false; return; }
    const x = X(lib.bins[i]), y = Y(v);
    if (!on2) { c.moveTo(x, y); on2 = true; } else c.lineTo(x, y);
  });
  c.stroke();

  c.fillStyle = 'rgba(232,234,240,.55)';
  c.font = '11px Inter, system-ui, sans-serif';
  c.textBaseline = 'middle';
  c.textAlign = 'right';
  c.fillText(hi.toFixed(1), pad.l - 6, Y(hi) + 6);
  c.fillText('0', pad.l - 6, Y(0));
  c.fillText(lo.toFixed(1), pad.l - 6, Y(lo) - 6);
  c.textAlign = 'center';
  c.textBaseline = 'top';
  for (const t of [-15, -10, -5, 0, 5, 10, 15]) {
    if (t < lib.bins[0] || t > lib.bins[lib.bins.length - 1]) continue;
    c.fillText(t === 0 ? 'mark' : `${t}s`, X(t), H - pad.b + 6);
  }
}

/* ==========================================================================
 * WHOLE SESSIONS
 * ==========================================================================
 * Asked for twice, the second time with a specific case: "i want it to also examine the overall
 * recording to look for something qualitatively different, if it can... i have 2 sessions i'd
 * like to compare." And before that: "if one sitting period was very calm, there might be
 * patterns across the entire sitting, not just at the markers."
 *
 * Everything the lab did before this was locked to marks — windows before a tap, epochs around
 * a noticing. That answers "what happens when I notice I was thinking" and cannot answer "was
 * this sit different from that one", which is a different and often more useful question.
 *
 * THIS SECTION DESCRIBES AND DOES NOT TEST, and the absence of a p-value is the point rather
 * than an omission. Two sits are two observations. Running a rank test over their per-second
 * rows would report a tiny p and be wrong twice over: consecutive seconds within a sit are
 * near-duplicates, so the effective count is a small fraction of the row count; and even with
 * that fixed, n = 2 sessions cannot separate "calmer" from "different day, different room,
 * different hour, slept differently". So the table shows the numbers and their differences, and
 * says what it would take to make a claim.
 */
function sessionStats({ read, notes, spans, durationSec, movement }) {
  const rows = read.metrics || [];
  const out = { durationSec: durationSec || null, rows: rows.length, series: {}, movement: movement || null };
  for (const k of Analysis.seriesKeys(rows)) {
    const vals = rows.map((r) => Number(r[k])).filter((v) => Number.isFinite(v));
    if (!vals.length) continue;
    const sorted = vals.slice().sort((a, b) => a - b);
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    // Median and IQR alongside the mean: a score that spends a sit pinned near its ceiling has
    // a high mean and no room to move, and only the spread shows that.
    out.series[k] = {
      mean,
      median: sorted[Math.floor(sorted.length / 2)],
      p25: sorted[Math.floor(sorted.length * 0.25)],
      p75: sorted[Math.floor(sorted.length * 0.75)],
      min: sorted[0],
      max: sorted[sorted.length - 1],
      n: vals.length,
    };
  }
  // Marks by category, which is the closest thing to a self-reported description of the sit.
  out.marks = {};
  for (const n of notes || []) {
    const k = n.transition || n.kind;
    if (!k) continue;
    out.marks[k] = (out.marks[k] || 0) + 1;
  }
  // The whole-sit self-reports, if any were given.
  out.dims = {};
  for (const sp of spans || []) {
    if (!sp.dims) continue;
    for (const [k, v] of Object.entries(sp.dims)) {
      if (v == null) continue;
      (out.dims[k] = out.dims[k] || []).push(v);
    }
  }
  return out;
}

let wholeA = null, wholeB = null;

function renderWhole() {
  const usable = sessions.filter((s) => !s.error && s.wholeStats);
  if (!usable.length) { wholeEl.innerHTML = ''; return; }
  const ids = usable.map((s) => s.sessionId);
  if (!ids.includes(wholeA)) wholeA = ids[0];
  if (!ids.includes(wholeB)) wholeB = ids.length > 1 ? ids[1] : ids[0];
  const A = usable.find((s) => s.sessionId === wholeA);
  const B = usable.find((s) => s.sessionId === wholeB);

  const opt = (sel) => usable.map((s) => `<option value="${esc(s.sessionId)}"`
    + `${s.sessionId === sel ? ' selected' : ''}>${esc(displayName(s))}</option>`).join('');
  const fmt = (v, dp = 2) => (v == null ? '—' : Number(v).toFixed(dp));
  const pct = (v) => (v == null ? '—' : (v * 100).toFixed(0));

  // Every series either session has, so a column present in one and absent in the other is
  // visible as absent rather than quietly dropped.
  const keys = Array.from(new Set(Object.keys(A.wholeStats.series).concat(Object.keys(B.wholeStats.series)))).sort();
  const seriesRows = keys.map((k) => {
    const a = A.wholeStats.series[k], b = B.wholeStats.series[k];
    const d = (a && b) ? (b.mean - a.mean) : null;
    return `<tr><td>${esc(k)}</td>
      <td class="num">${a ? pct(a.mean) : '—'}</td><td class="num">${a ? pct(a.median) : '—'}</td>
      <td class="num">${a ? pct(a.p25) + '–' + pct(a.p75) : '—'}</td>
      <td class="num">${b ? pct(b.mean) : '—'}</td><td class="num">${b ? pct(b.median) : '—'}</td>
      <td class="num">${b ? pct(b.p25) + '–' + pct(b.p75) : '—'}</td>
      <td class="num">${d == null ? '—' : (d > 0 ? '+' : '') + (d * 100).toFixed(0)}</td></tr>`;
  }).join('');

  const moveRows = Movement.compare(A.wholeStats.movement, B.wholeStats.movement).map((r) => {
    const L = Movement.LABELS[r.key] || { label: r.key, unit: '' };
    const dp = r.key === 'stillFrac' || r.key === 'medianRiseFrac' ? 3 : 2;
    return `<tr><td>${esc(L.label)}<br><span class="dim" style="font-size:10.5px">${esc(L.unit)}</span></td>
      <td class="num">${fmt(r.a, dp)}</td><td class="num">${fmt(r.b, dp)}</td>
      <td class="num">${r.delta == null ? '—' : (r.delta > 0 ? '+' : '') + r.delta.toFixed(dp)}</td>
      <td class="num">${r.ratio == null ? '—' : r.ratio.toFixed(2) + '×'}</td></tr>`;
  }).join('');

  const markLine = (s) => {
    const e = Object.entries(s.wholeStats.marks).filter(([k]) => k !== 'text' && k !== 'voice');
    return e.length ? e.map(([k, v]) => `${esc(k)} ${v}`).join(' · ') : '<span class="dim">none</span>';
  };
  const noMove = !A.wholeStats.movement || !B.wholeStats.movement;

  wholeEl.innerHTML = `<h2>Whole sessions</h2>
    <div class="card note">These are DESCRIPTIONS, not tests, and no p-value appears anywhere on
      purpose. Two sits are two observations: a rank test over their per-second rows would report
      a tiny p and be wrong twice over — consecutive seconds within a sit are near-duplicates so
      the effective count is a fraction of the row count, and n=2 sessions cannot separate
      "calmer" from "different day, different room, different hour, slept differently". To make a
      claim you need the same difference to reappear across several pairs of sits, which is what
      the mark search does for marks and what this table is collecting toward.</div>
    <div class="card row">
      <label>A <select id="wholeA">${opt(wholeA)}</select></label>
      <label>B <select id="wholeB">${opt(wholeB)}</select></label>
      <span class="dim">Unnamed sits show their filename. Name them in <b>Loaded</b> above —
        a comparison between two filenames is hard to read and easy to mix up.</span>
    </div>
    <div class="card">
      <table><tr><th></th><th>A — ${esc(displayName(A))}</th><th>B — ${esc(displayName(B))}</th></tr>
        <tr><td>Length</td><td class="num">${clock(A.wholeStats.durationSec)}</td><td class="num">${clock(B.wholeStats.durationSec)}</td></tr>
        <tr><td>Marks</td><td>${markLine(A)}</td><td>${markLine(B)}</td></tr>
        <tr><td>Alpha peak</td>
          <td class="num">${A.alpha && !A.alpha.fallback ? A.alpha.freqHz.toFixed(2) + ' Hz' : '<span class="dim">not measurable</span>'}</td>
          <td class="num">${B.alpha && !B.alpha.fallback ? B.alpha.freqHz.toFixed(2) + ' Hz' : '<span class="dim">not measurable</span>'}</td></tr>
      </table>
    </div>
    <div class="card">
      <h3 style="font-size:13px;margin:0 0 8px">Movement — from the accelerometer, not the EEG</h3>
      <div class="dim" style="margin-bottom:8px">Stillness is close to a direct measurement: a
        body that is not moving produces a flat trace, and no interpretation is involved. The two
        shape numbers test the idea that calm movements are evenly paced while agitated ones are
        front-loaded. Peak position separates those shapes about three times more strongly than
        crest does, so read it first.</div>
      ${noMove ? '<div class="note bad">At least one of these sessions has no accelerometer data,'
        + ' so the movement comparison is unavailable. Sessions restored from storage keep their'
        + ' movement summary; ones ingested before this existed do not — re-drop the archive.</div>'
        : `<table><tr><th>Measure</th><th>A</th><th>B</th><th>B − A</th><th>B ÷ A</th></tr>${moveRows}</table>`}
    </div>
    <div class="card scroll">
      <h3 style="font-size:13px;margin:0 0 8px">Recorded scores, whole sit</h3>
      <div class="dim" style="margin-bottom:8px">Mean, median and the middle half. The spread
        matters as much as the mean: a score that spends a sit pinned near its ceiling has a high
        mean and no room left to distinguish a good sit from a great one.</div>
      <table><tr><th>Series</th><th>A mean</th><th>A med</th><th>A 25–75</th>
        <th>B mean</th><th>B med</th><th>B 25–75</th><th>Δ mean</th></tr>${seriesRows}</table>
    </div>`;
  const selA = document.getElementById('wholeA'), selB = document.getElementById('wholeB');
  if (selA) selA.addEventListener('change', () => { wholeA = selA.value; renderWhole(); });
  if (selB) selB.addEventListener('change', () => { wholeB = selB.value; renderWhole(); });
}

/* ==========================================================================
 * INDIVIDUAL ALPHA PEAK
 * ==========================================================================
 * Every alpha number in the live app comes from a fixed 8-13Hz band, which is a population
 * average and not a person. An individual peak sits anywhere from about 7.5 to 13Hz, so a
 * fixed band can spend most of its width on someone's theta shoulder and low beta, and
 * dilute the thing it is supposed to measure.
 *
 * This panel exists to be READ SCEPTICALLY, so it shows the working: every channel, whether
 * a peak was found there, how far above the 1/f background it rose, how wide it is, and how
 * many clean 4-second windows went into the estimate. A refusal shows its reason. The
 * distinction between a measured band and the fixed fallback is stated in words on every
 * row, because those are different claims and must not look alike.
 */
function renderAlpha() {
  const usable = sessions.filter((s) => !s.error);
  if (!usable.length) { alphaEl.innerHTML = ''; return; }
  const withAlpha = usable.filter((s) => s.alpha);
  if (!withAlpha.length) {
    alphaEl.innerHTML = `<h2>Individual alpha peak</h2><div class="card note">
      No session here carries raw EEG, so the peak cannot be measured — these sits were
      restored from storage, which keeps the parsed rows and drops the samples. Re-drop the
      archives to measure it. Analysis falls back to the fixed
      ${DSP.BANDS.alpha[0]}–${DSP.BANDS.alpha[1]}Hz band.</div>`;
    return;
  }
  const rows = withAlpha.map((s) => {
    const a = s.alpha;
    const per = a.channels.map((c) => {
      if (!c.found) {
        return `<tr class="dim"><td>${esc(c.name)}</td><td colspan="4">${esc(c.reason || 'no peak')}</td></tr>`;
      }
      const isBest = c.channel === a.best;
      return `<tr><td>${isBest ? '<strong>' : ''}${esc(c.name)}${isBest ? ' ← used</strong>' : ''}</td>
        <td class="num">${c.cogHz.toFixed(2)} Hz</td>
        <td class="num">${c.prominence.toFixed(1)}×</td>
        <td class="num">${c.widthHz.toFixed(2)} Hz</td>
        <td class="num">${c.windows}${c.skipped ? ` <span class="dim">(${c.skipped} dropped)</span>` : ''}</td></tr>`;
    }).join('');
    const head = a.fallback
      ? `<div class="card note bad">No alpha peak found in any channel. Using the FIXED
         ${DSP.BANDS.alpha[0]}–${DSP.BANDS.alpha[1]}Hz band, which is a population
         average and not this person: ${esc(a.reason || '')}</div>`
      : `<div class="card note"><strong>${a.freqHz.toFixed(2)} Hz</strong> from
         ${esc(a.bestName)}, ${a.prominence.toFixed(1)}× above the 1/f background.
         Individual alpha band <strong>${a.band[0].toFixed(2)}–${a.band[1].toFixed(2)} Hz</strong>
         (peak ±2Hz), which is what the 4-second series below is computed with.</div>`;
    const spec = s.spectra
      ? `<div class="dim">${s.spectra.rows.length} non-overlapping ${s.spectra.windowSec}s
         windows, ${s.spectra.binHz} Hz bins.</div>`
      : '<div class="dim">no recomputed series</div>';
    return `<div class="card"><strong>${esc(s.file)}</strong>${head}
      <table><tr><th>Channel</th><th>Peak</th><th>Prominence</th><th>Width</th>
      <th>Clean 4s windows</th></tr>${per}</table>${spec}</div>`;
  }).join('');
  const missing = sessionsWithoutSpectra();
  const srcNote = missing.length
    ? `<div class="card note">${missing.length} session(s) have no recomputed series and will
       fall back to metrics.csv whichever source is selected: ${esc(missing.map((s) => s.file).join(', '))}.</div>`
    : '';
  alphaEl.innerHTML = `<h2>Individual alpha peak</h2>
    <div class="card">
      <label>Analysis reads
        <select id="srcSel">
          <option value="metrics"${analysisSource === 'metrics' ? ' selected' : ''}>1s rows from metrics.csv</option>
          <option value="spectra"${analysisSource === 'spectra' ? ' selected' : ''}>4s windows recomputed from raw EEG</option>
        </select>
      </label>
      <div class="dim">metrics.csv is what the app computed live: 1Hz, from 1-second windows,
      so 1Hz frequency bins. The recomputed series uses 4-second windows (0.25Hz bins) and
      this session's own alpha band, at a quarter of the time resolution. The windows do not
      overlap, so each row is an independent observation and the p-values downstream mean
      what they say.</div>
    </div>${srcNote}${rows}`;
  const sel = document.getElementById('srcSel');
  if (sel) sel.addEventListener('change', () => { analysisSource = sel.value; render(); });
}

/* ==========================================================================
 * NAMING SESSIONS
 * ==========================================================================
 * "i think i would have to label which zip is which for the whole event, right? to make sense of
 * it? should we include that?"
 *
 * Yes, and it is the difference between a usable comparison and two filenames. `move-a.zip` versus
 * `move-b.zip` tells you nothing about which was the calm one; "retreat day 3, very settled"
 * versus "after coffee, restless" is the entire point of comparing them.
 *
 * The app already lets a sit be named where it is saved. That name does not travel in the archive
 * in a machine-readable place — it goes into the markdown title — so rather than parse prose out
 * of a report, the lab keeps its own label. Two consequences worth accepting: a sit can be named
 * differently in the two places, and the lab's name is the one the analysis shows. That is the
 * right way round, because naming happens here while looking at the comparison.
 */
function labelOf(s) { return (s && s.label) || ''; }
function displayName(s) {
  const l = labelOf(s);
  return l ? `${l}` : s.file;
}

async function setLabel(sessionId, label) {
  const s = sessions.find((x) => x.sessionId === sessionId);
  if (!s) return;
  s.label = label;
  await persist();
}

/*
 * PROGRESS, rendered on its own.
 *
 * Separate from render() because render() redraws every pane for every sit, and calling that once per
 * sit inside the analysis loop would cost more than the analysis. This touches one element.
 */
function renderProgress() {
  const el = document.getElementById('analyseProgress');
  if (!el) return;
  if (!analysing.active) { el.innerHTML = ''; return; }
  const pct = analysing.total ? Math.round((analysing.done / analysing.total) * 100) : 0;
  el.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between">
      <div><strong>Analysing ${Math.min(analysing.done + 1, analysing.total)} of
        ${analysing.total}</strong> <span class="dim">· ${esc(analysing.current)}</span></div>
      <button id="cancelAnalyse">Stop</button>
    </div>
    <div style="height:4px;border-radius:3px;background:rgba(255,255,255,.09);margin-top:10px">
      <i style="display:block;height:100%;border-radius:3px;width:${pct}%;background:var(--good)"></i>
    </div>
    <div class="note" style="margin-top:8px">Reading the raw EEG and measuring the alpha peak. A long
      sit takes a second or two. Each result is kept, so this never runs twice for the same sit.</div>
    </div>`;
  const stop = document.getElementById('cancelAnalyse');
  /* Cancel takes effect BETWEEN sits, not inside one. Abandoning a sit half-derived would leave a
     session object with some fields computed and some not, which every view downstream would read as
     real. Stopping cleanly costs at most one sit's wait. */
  if (stop) {
    stop.addEventListener('click', () => {
      analysing.cancel = true;
      stop.textContent = 'Stopping…';
      stop.disabled = true;
    });
  }
}

/*
 * EVERY RECORDING ON THIS DEVICE, IN ONE LIST, whether or not it has been analysed.
 *
 * The old list showed only sits the lab had already parsed. That made the list of what exists and the
 * list of what has been looked at the same list — so the only way to see a sit was to have already
 * paid to analyse it, and the only way to make the list complete was to analyse everything on page
 * load. That is what froze the page. Splitting them is what lets it open instantly.
 *
 * WHAT A ROW SHOWS WITHOUT ANY ANALYSIS: the sit's own general note as its name, when it was, how
 * long, and its mark tally by kind. All of that comes from Recorder.listSessions, which reads two
 * small object stores and never touches a chunk of EEG. It is most of what the list was ever showing.
 *
 * WHAT NEEDS THE ANALYSIS: signal quality, labelled spans, the alpha peak, the timeline. Those say
 * "not analysed yet" with a button, rather than being absent — a blank cell and a cell that cannot be
 * filled yet are different claims.
 */
function sitEntries() {
  const out = [];
  // The device's own recordings, newest first (listSessions already sorts).
  for (const sit of appSits.available) {
    out.push({ key: `rec:${sit.id}`, sit, s: analysedFor(sit) });
  }
  /* Dropped archives that are not one of this device's recordings — a sit carried over from another
     machine. Matched the same two ways as analysedFor, so a dropped copy of a local sit does not
     appear twice. */
  for (const s of sessions) {
    const local = appSits.available.some((a) =>
      (s.recorderId && s.recorderId === a.id) || s.file === a.archiveName);
    if (!local) out.push({ key: `file:${s.sessionId}`, sit: null, s });
  }
  return out;
}

// The mark tally for a row, from whichever source is available: the analysed notes if the sit has
// been analysed, otherwise the tally Recorder counted while listing. Both are counts of the same
// marks, so a row's tally does not change when it is analysed.
function tallyFor(entry) {
  const { sit, s } = entry;
  if (s && !s.error) {
    const tally = {};
    for (const n of (s.read && s.read.notes) || []) {
      const k = n.tapCategory || n.transition || n.markKind;
      if (!k || n.anchored === 'no' || n.anchored === false) continue;
      tally[k] = (tally[k] || 0) + 1;
    }
    return Object.entries(tally).sort((a, b) => b[1] - a[1]);
  }
  return (sit && sit.markTally) || [];
}

function tallyHtml(kindsHere) {
  if (!kindsHere.length) return '<span class="dim">none</span>';
  /* ALL ONE KIND IS CALLED OUT. "the only thing that's useful is knowing how many marks i made" —
     and a total alone does not say whether a sit can contribute: eleven marks all of one kind cannot
     support a comparison BETWEEN kinds, which is what the marks are for. */
  return kindsHere.map(([k, n]) => `${n}× ${esc(kindLabelFor(k))}`).join(', ')
    + (kindsHere.length === 1 && kindsHere[0][1] > 1
      ? ' <span class="bad">— all one kind</span>' : '');
}

/* When the sit was. From the recording's own start time where there is one, so a reader comparing
   sits is comparing moments rather than filenames. */
function whenText(entry) {
  const { sit, s } = entry;
  const ms = sit ? sit.startedAt
    : (s && s.read && s.read.metrics && s.read.metrics[0]
      ? Date.parse(s.read.metrics[0].absoluteTime) : NaN);
  if (!Number.isFinite(ms)) return '<span class="dim">—</span>';
  const d = new Date(ms);
  return `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`
    + ` <span class="dim">${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span>`;
}

function excludedHtml() {
  const gone = appSits.available.filter((a) => excluded.has(a.id));
  if (!gone.length) return '';
  /* SET ASIDE, NOT DELETED, and visible. A sit that vanished entirely would be indistinguishable from
     data loss, and the × is meant to be reversible — it does not touch the recording. */
  return `<div class="card note" style="margin-top:12px">
    <div class="sideHead" style="margin-bottom:8px">Set aside · ${gone.length}</div>
    ${gone.map((a) => `<div class="row" style="margin-bottom:5px">
      <span class="dim" style="flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap">${esc(sitName(a))}</span>
      <button data-include="${esc(a.id)}">Put back</button></div>`).join('')}
    <div class="why" style="margin-top:8px">These are left out of every analysis on this page. The
      recordings themselves are untouched.</div></div>`;
}

function sitsTableHtml() {
  const entries = sitEntries().filter((e) => !(e.sit && excluded.has(e.sit.id)));
  if (!entries.length) {
    return `<div class="card note">No recordings on this device yet, and nothing dropped in.
      Sit with the headband on and press Record, or drop a session archive above.</div>`;
  }
  const unanalysed = entries.filter((e) => !e.s && e.sit && !e.sit.tooShort);
  /* THE ONE CONTROL THAT MATTERS, above the table. Nothing here is analysed on load, so the reader
     needs a way to say "do the ones I care about" — and a count, so the wait is predictable rather
     than a spinner of unknown length. */
  const bulk = unanalysed.length && !analysing.active
    ? `<div class="row" style="margin:10px 0 0">
        <button class="primary" id="analyseAll">Analyse ${unanalysed.length} unread
          sit${unanalysed.length === 1 ? '' : 's'}</button>
        <span class="note">About ${unanalysed.length < 2 ? 'a second or two' :
          `${Math.ceil(unanalysed.length * 1.5)} seconds`} in total. Each sit is analysed once and
          remembered, so this does not run again for the same sit.</span></div>`
    : '';
  const rows = entries.map((entry) => {
    const { sit, s } = entry;
    const i = s ? sessions.indexOf(s) : -1;
    if (s && s.error) {
      return `<tr class="sesMain"><td></td><td>${esc(s.file)}</td>
        <td colspan="4" class="bad">${esc(s.error)}</td>
        <td><button data-drop="${i}">Remove</button></td></tr>`;
    }
    const name = s ? (labelOf(s) || sitName(sit) || s.file) : sitName(sit);
    const durationSec = s && s.durationSec != null ? s.durationSec : (sit ? sit.durationSec : null);

    /* THE ARROW only where there is something behind it. An expander on an unanalysed row would open
       an empty box, which reads as broken rather than as "nothing here yet". */
    const arrow = s
      ? `<button class="expander" data-expand="${i}" title="Show this sit's timeline and alpha peak"
          aria-expanded="${expanded.has(i) ? 'true' : 'false'}">${expanded.has(i) ? '▾' : '▸'}</button>`
      : '';

    /* The name is editable only once analysed, because the label is stored on the lab's session
       record. Before that the sit shows the name it gave itself, which is the note. */
    const nameCell = s
      ? `<input class="sesLabel" data-label="${i}" value="${esc(labelOf(s) || sitName(sit))}"
          placeholder="name this sit — what was it?" maxlength="120"
          style="width:100%;max-width:320px;font-size:12.5px">`
      : `<div style="max-width:320px;font-size:12.5px">${esc(name)}</div>`;
    const sub = sit && sit.generalNote && s && labelOf(s) && labelOf(s) !== sit.generalNote
      ? `<div class="dim" style="font-size:11px;margin-top:3px">note: ${esc(sit.generalNote)}</div>`
      : (!sit && s ? `<div class="dim" style="font-size:11px;margin-top:3px">${esc(s.file)}</div>` : '');

    let signal;
    if (s) {
      /* A SIMULATED SIT IS CALLED OUT IN THE ROW, not folded into a warning count. "3 warning(s)"
         behind a tooltip is exactly how a fabricated sit gets analysed anyway. Once pooled with real
         sits no later step can separate it again, so the label has to be readable at a glance, in the
         list where sits are chosen. */
      signal = s.read.simulated
        ? '<span class="bad" title="Produced by the app\'s signal simulator with no headband'
          + ' connected. Not a recording of anyone — set it aside before drawing any'
          + ' conclusion.">SIMULATED</span>'
        : (s.read.warnings.length
          ? `<span class="warn" title="${esc(s.read.warnings.join(' · '))}">${s.read.warnings.length} warning(s)</span>`
          : '<span class="good">complete</span>');
    } else if (sit && sit.simulated) {
      signal = '<span class="bad">SIMULATED</span>';
    } else if (sit && sit.tooShort) {
      signal = '<span class="dim" title="Under 20 seconds — too short to carry any scored rows.">too short</span>';
    } else if (analysing.active) {
      signal = '<span class="dim">waiting…</span>';
    } else {
      signal = `<button data-analyse="${esc(sit.id)}" title="Read this sit's raw EEG and derive its
        signal quality, alpha peak and timeline">Analyse</button>`;
    }

    const spans = s ? (s.spans.filter((x) => x.dims).length || '<span class="dim">0</span>')
      : '<span class="dim">—</span>';

    return `<tr class="sesMain">
      <td>${arrow}</td>
      <td>${nameCell}${sub}</td>
      <td>${whenText(entry)}</td>
      <td class="num">${clock(durationSec)}</td>
      <td>${tallyHtml(tallyFor(entry))}</td>
      <td class="num">${spans}</td>
      <td>${signal}</td>
      <td>${sit
        ? `<button data-exclude="${esc(sit.id)}" title="Leave this sit out of every analysis on this page. Does not delete the recording.">×</button>`
        : `<button data-drop="${i}" title="Leave this sit out of every analysis on this page">×</button>`}</td></tr>`
      /* THE TIMELINE AND THE ALPHA PEAK LIVE BEHIND THE ARROW.
         "alternatively, every entry in the Loaded section could have a little arrow that expands and
         lets me see the visual timeline. that's where the individual alpha peak could live too." */
      + (s && expanded.has(i) ? `<tr class="sesDetail"><td></td><td colspan="7">
          <div id="detail-${i}"></div></td></tr>` : '');
  }).join('');

  const analysedCount = entries.filter((e) => e.s && !e.s.error).length;
  const countNote = `<div class="note" style="margin-top:10px">
    <strong>${entries.length}</strong> sit${entries.length === 1 ? '' : 's'} on this device
    · <strong>${analysedCount}</strong> analysed. Nothing is read until you ask for it, which is why
    this page opens straight away. Only analysed sits can be compared.</div>`;

  return countNote + bulk + `<div class="card scroll"><table>
    <tr><th></th><th>Sit</th><th>When</th><th>Length</th><th>Marks</th><th>Labelled spans</th>
        <th>Signal</th><th></th></tr>${rows}</table></div>`;
}

function wireSitsTable() {
  loadedEl.querySelectorAll('[data-analyse]').forEach((b) => {
    b.addEventListener('click', () => analyseSits([b.dataset.analyse]));
  });
  const all = document.getElementById('analyseAll');
  if (all) {
    all.addEventListener('click', () => analyseSits(
      sitEntries().filter((e) => !e.s && e.sit && !e.sit.tooShort && !excluded.has(e.sit.id))
        .map((e) => e.sit.id)));
  }
  loadedEl.querySelectorAll('[data-exclude]').forEach((b) => {
    b.addEventListener('click', () => {
      excluded.add(b.dataset.exclude);
      saveExcluded();
      render();
    });
  });
  loadedEl.querySelectorAll('[data-include]').forEach((b) => {
    b.addEventListener('click', () => {
      excluded.delete(b.dataset.include);
      saveExcluded();
      render();
    });
  });
  /* The arrow: the timeline and the alpha peak for one sit, drawn only when opened. Both used to be
     full-width sections above the analyses, permanently, for something looked at rarely — and one of
     them ("the timelines aren't really useful for me") never. */
  loadedEl.querySelectorAll('[data-expand]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.expand);
      if (expanded.has(i)) expanded.delete(i); else expanded.add(i);
      renderLoaded();
    });
  });
  /* Saved on blur and on Enter, not per keystroke: one write per edit, and no re-render mid-typing to
     move the caret. */
  loadedEl.querySelectorAll('[data-label]').forEach((input) => {
    const s = sessions[Number(input.dataset.label)];
    const save = async () => {
      if (!s || input.value === labelOf(s)) return;
      await setLabel(s.sessionId, input.value.trim());
      renderWhole();
    };
    input.addEventListener('blur', save);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  });
  loadedEl.querySelectorAll('[data-drop]').forEach((b) => {
    b.addEventListener('click', async () => {
      // Forget it in the store too. Removing it only from memory means it reappears on the next
      // reload, which reads as the Remove button not working.
      const [gone] = sessions.splice(Number(b.dataset.drop), 1);
      if (store && gone) {
        try { await LabStore.deleteSession(store, gone.sessionId); } catch (e) { /* additive */ }
      }
      expanded.clear();   // the indexes just shifted
      render();
    });
  });
}

function renderLoaded() {
  /* SAID OUT LOUD. A duplicate that is quietly dropped is indistinguishable from a drop that did not
     work, and the reason matters: it is the same recording, not a similar one. */
  const dupNote = duplicates.length
    ? `<div class="card note bad">Refused ${duplicates.length} duplicate archive(s) — the same
       recording under a different filename, which would inflate the observation count and could
       put the same seconds on both sides of the train/test split:
       ${esc(duplicates.map((d) => `${d.file} (same sit as ${d.sameAs})`).join('; '))}.</div>`
    : '';
  const handoffNote = handedOver.length
    ? `<div class="card note">Received from the app: ${esc(handedOver.join(', '))}.</div>`
    : '';
  const errNote = appSits.error
    ? `<div class="card note bad">Could not read this device's recordings: ${esc(appSits.error)}.
       Drop archives above instead.</div>`
    : '';
  /* A SIT THAT FAILED TO ANALYSE IS NAMED. Otherwise it is indistinguishable in the list from one
     nobody selected, and the difference decides whether a comparison is missing data. */
  const failNote = analysing.failed.length
    ? `<div class="card note warn">Could not analyse ${analysing.failed.length} sit(s):
       ${esc(analysing.failed.map((f) => `${f.name} (${f.why})`).join('; '))}.</div>`
    : '';
  loadedEl.innerHTML = `<h2>Your sits</h2>${errNote}${dupNote}${handoffNote}${failNote}`
    + `<div id="analyseProgress"></div>` + sitsTableHtml() + excludedHtml();
  wireSitsTable();
  renderProgress();
  for (const i of expanded) renderSitDetail(i);
}

/*
 * One timeline per session: every stored metric, plus the notes and transitions in
 * their right places.
 *
 * Drawn from metrics.csv rather than recomputed from raw, because these are the
 * numbers the app ACTUALLY SHOWED at the time — which is what a label needs comparing
 * against. Recomputing with today's formula would compare a label to a number the
 * person never saw.
 */
const SERIES_COLOURS = {
  calm: '#e3c56b', thinking: '#f19bbb', focus: '#7dd3fc', drowsy: '#a78bfa',
  equanimity: '#86efac', hrv: '#fb923c', breath: '#c4b5fd', noise: '#6b7280',
};

/*
 * ONE SIT'S DETAIL, behind its arrow: the timeline, and its individual alpha peak.
 *
 * Both are per-sit facts that were being shown as page-wide sections. The alpha peak in particular
 * belongs here rather than above the analyses — and it comes with the caveat it has earned: measured
 * across eight real sits it was not found in ANY of them, because alpha is suppressed with the eyes
 * open and that is how this practice is done.
 */
function renderSitDetail(i) {
  const host = document.getElementById(`detail-${i}`);
  const s = sessions[i];
  if (!host || !s || s.error) return;
  const a = s.alpha;
  const peak = a && a.freqHz != null
    ? `<strong>${a.freqHz.toFixed(2)} Hz</strong> at ${esc(a.bestName || '?')}`
      + `${a.fallback ? ' <span class="bad">(fallback — the gates were not met, so this is a guess'
        + ' rather than a measurement)</span>' : ''}`
    : `<span class="dim">no peak found${a && a.reason ? ` — ${esc(a.reason)}` : ''}</span>`;
  host.innerHTML = `<div class="card" style="margin:8px 0">
      <div class="sideHead">Individual alpha peak</div>
      <div>${peak}</div>
      <div class="why" style="margin-top:6px">Alpha is strongly suppressed when the eyes are open, and
      the forehead sensors see less of it than the back of the head would. Across eight real sits here
      it was not measurable in any of them — the alpha region sat BELOW the background trend rather
      than above it. For eyes-open practice this number may simply not exist, and that is a fact about
      the sensor placement rather than about the sit.</div>
    </div>
    <div class="card" style="margin:8px 0"><div class="sideHead">Timeline</div>
      <div id="tl-${i}"></div></div>`;
  drawOneTimeline(i, document.getElementById(`tl-${i}`));
}

/*
 * ONE timeline, inside an opened row.
 *
 * The page-wide Timelines section is gone: "the timelines aren't really useful for me. the only thing
 * that's useful is knowing how many marks i made." The mark tally moved into the table, and the drawing
 * moved behind the row's arrow — same canvas, same series, same gaps-are-gaps behaviour, reached only
 * when asked for.
 */
function drawOneTimeline(i, host) {
  const s = sessions[i];
  if (!host) return;
  if (!s || s.error || !s.read.metrics.length) {
    host.innerHTML = '<span class="dim">no per-second rows in this sit</span>';
    return;
  }
  host.innerHTML = `<p class="sub" style="margin-top:0">The numbers the app displayed at the time, not
    recomputed — a label has to be compared against what was actually on screen.</p>
    <canvas id="tlc${i}" height="190"></canvas><div class="legend" id="tll${i}"></div>`;
  drawTimeline(s, document.getElementById(`tlc${i}`), document.getElementById(`tll${i}`));
}

// Kept as a no-op host clear so nothing page-wide is drawn. The drawing itself lives in
// drawOneTimeline, per sit, behind the arrow.
function renderTimelines() {
  const host = document.getElementById('timelines');
  if (host) host.innerHTML = '';
}

function drawTimeline(s, canvas, legendEl) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = 190;
  canvas.width = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.round(H * dpr);
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  const rows = s.read.metrics;
  const tMax = s.durationSec || 1;
  const keys = Object.keys(SERIES_COLOURS).filter((k) =>
    rows.some((r) => r[k] != null && Number.isFinite(r[k])));

  // Labelled spans as background bands, so a correlation can be eyeballed before it
  // is computed — and disbelieved when the bands plainly do not line up.
  for (const span of s.spans) {
    if (!span.dims) continue;
    const x0 = (span.fromSec / tMax) * W, x1 = (span.toSec / tMax) * W;
    const f = span.dims.focus;
    c.fillStyle = f == null ? 'rgba(255,255,255,.03)'
      : `rgba(${f > 3 ? '127,216,160' : '255,143,143'},${0.04 + Math.abs(f - 3) * 0.03})`;
    c.fillRect(x0, 0, Math.max(1, x1 - x0), H);
  }

  for (const key of keys) {
    c.beginPath();
    c.strokeStyle = SERIES_COLOURS[key];
    c.lineWidth = 1.3;
    let started = false;
    for (const r of rows) {
      const v = r[key];
      // A gap in the data must be a GAP, not a straight line across it. Joining
      // through a dropout invents values and smooths over exactly the artifacts a
      // reader should notice.
      if (v == null || !Number.isFinite(v)) { started = false; continue; }
      const x = (r.t / tMax) * W;
      const y = H - 12 - Math.max(0, Math.min(1, v)) * (H - 26);
      if (started) c.lineTo(x, y); else { c.moveTo(x, y); started = true; }
    }
    c.stroke();
  }

  // Notes and transitions.
  for (const n of s.notes) {
    if (n.anchored === false || n.offsetSec == null) continue;
    const x = (n.offsetSec / tMax) * W;
    const isTrans = n.kind === 'transition';
    c.strokeStyle = isTrans ? 'rgba(255,255,255,.55)' : 'rgba(255,210,122,.7)';
    c.lineWidth = 1;
    c.setLineDash(isTrans ? [] : [2, 3]);
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
    c.setLineDash([]);
    if (isTrans && n.transition) {
      c.fillStyle = 'rgba(255,255,255,.75)';
      c.font = '9px ui-monospace, monospace';
      c.save(); c.translate(x + 3, 11); c.fillText(n.transition.slice(0, 4), 0, 0); c.restore();
    }
  }

  legendEl.innerHTML = keys.map((k) =>
    `<span><i style="background:${SERIES_COLOURS[k]}"></i>${k}</span>`).join('')
    + '<span class="dim">│ solid = transition · dashed = note · green/red bands = focus label</span>';
}

/*
 * The search. This is the part that has to be trusted, so its output leads with the
 * verdict in words and shows the size of the search next to every result.
 */
/*
 * Trial results. Reported separately from the general search because a trial is a
 * different kind of evidence: the label was decided in advance, so a difference
 * between conditions cannot be an artefact of the labeller having seen the screen.
 *
 * The positive control is shown FIRST and framed as a check on the equipment. If it
 * fails, everything below it is void — so the page says that outright rather than
 * leaving both tables on screen with equal weight.
 */
function renderTrials() {
  const withTrials = sessions.filter((s) => !s.error && s.trialBlocks && s.trialBlocks.length);
  let host = document.getElementById('trials');
  if (!withTrials.length) { host?.remove(); return; }
  if (!host) {
    host = document.createElement('div');
    host.id = 'trials';
    (document.getElementById('timelines') || loadedEl).after(host);
  }

  // Grouped by protocol: mixing a control with a meditation trial would average two
  // different questions together.
  const byProtocol = {};
  for (const s of withTrials) {
    for (const b of s.trialBlocks) {
      const key = b.trialKey || 'unknown';
      (byProtocol[key] = byProtocol[key] || []).push({ session: s, block: b });
    }
  }

  const sections = Object.entries(byProtocol).map(([key, entries]) => {
    const proto = Trials.BY_KEY[key];
    const sessionIds = Array.from(new Set(entries.map((e) => e.session.sessionId)));
    // Build units per session, so blocks stay tied to the sit they came from.
    const units = [];
    for (const sid of sessionIds) {
      const s = withTrials.find((x) => x.sessionId === sid);
      const blocks = entries.filter((e) => e.session.sessionId === sid).map((e) => e.block);
      units.push(...Trials.unitsFromRun(
        { protocol: proto || { conditions: [], key }, blocks },
        rowsOf(s), { sessionId: sid },
      ));
    }
    if (!units.length) return '';

    const isControl = key === 'alpha-control';
    const featureList = Array.from(units.reduce((set, u) => {
      Object.keys(u.features).forEach((k) => set.add(k)); return set;
    }, new Set())).sort();

    // For a control, the expected direction was declared in advance, so report it.
    let controlHtml = '';
    if (isControl) {
      const checks = ['calm', 'focus', 'drowsy'].filter((f) => featureList.includes(f))
        .map((f) => Trials.controlCheck(units, { feature: f, expectHigherIn: 'closed' }));
      const calm = checks.find((c) => c.feature === 'calm');
      const verdict = !calm || calm.ok == null
        ? { cls: 'warn', text: 'Not enough blocks to check the control yet.' }
        : calm.ok
          ? { cls: 'good', text: 'CONTROL PASSED. Calm is clearly higher with the eyes'
              + ' closed, which is the textbook Berger effect. The signal chain —'
              + ' electrodes, filtering, band powers, timing, export — is doing'
              + ' something real, so a null result elsewhere is a fact about'
              + ' meditation rather than about the wiring.' }
          : { cls: 'bad', text: 'CONTROL FAILED. Calm is not higher with the eyes closed,'
              + ' and it should be — this is one of the most reliable findings in EEG.'
              + ' Something in the signal chain is wrong: check electrode contact first,'
              + ' then whether the blocks were actually followed. Until this passes,'
              + ' NOTHING else on this page means anything.' };
      controlHtml = `<div class="card verdict ${verdict.cls}">${esc(verdict.text)}</div>`
        + `<div class="card scroll"><table>
            <tr><th>Feature</th><th>Eyes closed</th><th>Eyes open</th><th>Difference</th>
                <th>Effect size</th><th>Expected direction</th></tr>
            ${checks.map((c) => `<tr><td>${esc(c.feature)}</td>
              <td class="num">${f2(c.meanExpected)}</td>
              <td class="num">${f2(c.meanOther)}</td>
              <td class="num">${f2(c.difference)}</td>
              <td class="num">${c.effectSize == null ? '—'
                : (c.effectSize === Infinity ? '∞' : c.effectSize.toFixed(2))}</td>
              <td>${c.ok === true ? '<span class="good">yes</span>'
                : c.ok === false ? '<span class="bad">no</span>' : '<span class="dim">—</span>'}</td>
            </tr>`).join('')}</table></div>`;
    }

    // And the same disciplined search, over the trial's own condition label.
    const res = Analysis.search(units, { iterations: 1500 });
    const rows = res.tests.slice(0, 20).map((t) => `<tr>
      <td>${esc(t.feature)}</td><td class="num">${f2(t.trainRho)}</td>
      <td class="num">${t.p == null ? '—' : t.p.toFixed(4)}</td>
      <td class="num">${t.q == null ? '—' : t.q.toFixed(3)}</td>
      <td class="num">${f2(t.testRho)}</td>
      <td>${t.heldUp === true ? '<span class="good">held</span>'
        : t.heldUp === false ? '<span class="bad">did not hold</span>'
        : '<span class="dim">—</span>'}</td></tr>`).join('');

    const counts = units.reduce((m, u) => { m[u.conditionKey] = (m[u.conditionKey] || 0) + 1; return m; }, {});
    return `<h2>${esc(proto ? proto.label : key)}${isControl ? ' — positive control' : ''}</h2>
      <p class="sub">${esc(proto ? proto.expectation : 'unknown protocol — expectation not recorded')}</p>
      ${controlHtml}
      <div class="card">
        <div class="note" style="margin-bottom:10px">
          ${units.length} blocks across ${sessionIds.length} session(s) ·
          ${Object.entries(counts).map(([k, v]) => `${esc(k)}: ${v}`).join(' · ')} ·
          settling periods excluded
        </div>
        <div class="card verdict" style="margin:0 0 12px">${esc(res.verdict)}</div>
        <div class="scroll"><table>
          <tr><th>Feature</th><th>rho (train)</th><th>p</th><th>q</th>
              <th>rho (held out)</th><th>Held out</th></tr>${rows}</table></div>
      </div>`;
  }).join('');

  host.innerHTML = sections;
}

/*
 * TWO SOURCES OF OBSERVATIONS, and the second one is why anything is analysable yet.
 *
 * Spans are hand-labelled stretches with dimensional ratings. Nobody has been making
 * them — the one-key taps arrived after the lab did — so three sits loaded with plenty
 * of marks used to produce "no labelled spans, nothing to correlate": a tooling dead
 * end dressed up as a null result.
 *
 * Marks are the taps themselves, each turned into the window just BEFORE it. Run as a
 * SEPARATE search rather than pooled with the spans, because the two ask different
 * questions (how strong was a state over minutes, versus what preceded a noticed
 * moment) and pooling them would mix the multiplicity correction of both.
 */
const MARK_LEAD_SEC = 10;   // how far back from a mark the window reaches
const MARK_TAIL_SEC = 2;    // dropped: the keypress and the noticing itself live here

function renderSearch() {
  const usable = sessions.filter((s) => !s.error);
  if (!usable.length) { outEl.innerHTML = ''; return; }
  const forAnalysis = usable.map((s) => ({
    sessionId: s.sessionId, metrics: rowsOf(s), spans: s.spans, notes: s.notes,
  }));

  const spanUnits = Analysis.unitsFromSpans(forAnalysis);
  const markUnits = Analysis.unitsFromMarks(forAnalysis, {
    leadSec: MARK_LEAD_SEC, tailSec: MARK_TAIL_SEC,
  });

  if (!spanUnits.length && !markUnits.length) {
    outEl.innerHTML = `<h2>Patterns</h2><div class="card verdict">
      Nothing to correlate against yet. This needs either one-key taps during a sit
      (turn Training on and press a category key when you notice something) or
      hand-labelled spans from the Notes panel. Neither is present in what is
      loaded.</div>`;
    return;
  }

  lastReports = [];
  let html = '<h2>Patterns</h2>';

  if (markUnits.length) {
    const marks = markUnits.filter((u) => !u.isControl);
    const kinds = marks.reduce((m, u) => { m[u.markKind] = (m[u.markKind] || 0) + 1; return m; }, {});
    const res = Analysis.search(markUnits, { iterations: 1500 });
    const rep = Findings.report(res, { label: 'windows before a mark' });
    lastReports.push({ title: 'Marks', report: rep });
    // Wrapped and named so each search can be pointed at — by a reader comparing the
    // two, and by the tests, which otherwise pick up whichever headline is first.
    html += `<section data-source="marks"><h3>Marks</h3><div class="card note">
      <strong>What is being compared.</strong> Each mark contributes the
      ${MARK_LEAD_SEC - MARK_TAIL_SEC} seconds ending ${MARK_TAIL_SEC}s before you
      pressed the key — a mark describes the stretch just before it, and the last
      couple of seconds are dropped because pressing a key moves a hand and a jaw,
      and that muscle activity lands in the same frequencies the scores are built
      from. ${marks.length} marks
      (${Object.entries(kinds).map(([k, v]) => `${esc(k)}: ${v}`).join(' · ')})
      against ${markUnits.length - marks.length} random windows from the same sits,
      kept clear of every mark.
      </div>` + reportHtml(rep, res) + '</section>';
  }

  if (spanUnits.length) {
    const res = Analysis.search(spanUnits, { iterations: 1500 });
    const rep = Findings.report(res, { label: 'labelled spans' });
    lastReports.push({ title: 'Hand-labelled spans', report: rep });
    html += '<section data-source="spans"><h3>Hand-labelled spans</h3>'
      + reportHtml(rep, res) + '</section>';
  } else {
    html += `<div class="card note">No hand-labelled spans loaded. Those come from the
      Notes panel or the closing screen and rate a whole stretch on four dimensions —
      a different and slower kind of evidence from the taps above.</div>`;
  }

  outEl.innerHTML = html + handoffBarHtml();
  wireHandoff();
}

/*
 * A report, prose first.
 *
 * The headline is a sentence; each finding is a sentence. The numbers live behind a
 * toggle, because they are for CHECKING a claim rather than forming one — and a reader
 * who is not a statistician cannot form one from them anyway.
 */
function reportHtml(rep, res) {
  const cls = { found: 'good', nothing: 'warn', 'not-enough': 'warn', unvalidatable: 'warn' };
  const findings = rep.confirmed.map((f) => `<div class="finding${f.strength === 'weak' ? ' weak' : ''}">
      <h4>${esc(f.sentence)}</h4>
      ${f.caveat ? `<div class="warnNote">${esc(f.caveat)}</div>` : ''}
      <div class="step"><strong>Next:</strong> ${esc(f.nextStep)}</div>
      <div class="meta">${esc(f.evidence)}</div>
    </div>`).join('');

  const collapsed = rep.collapsed.length ? `<details><summary>
      ${rep.collapsed.length} looked promising and then failed the held-out check —
      show them</summary><div class="note" style="margin-top:10px">
      ${rep.collapsed.map((c) => `<div style="margin:8px 0">${esc(c.sentence)}</div>`).join('')}
      </div></details>` : '';

  const table = res ? `<details><summary>Show all ${res.comparisons} comparisons
      (for checking, not for reading)</summary><div class="scroll" style="margin-top:10px">
      <table><tr><th>Feature</th><th>Label</th><th>rho fit</th><th>p</th><th>q</th>
        <th>rho held out</th><th>Held out</th><th>n</th></tr>
      ${res.tests.slice(0, 40).map((t) => `<tr><td>${esc(t.feature)}</td><td>${esc(t.label)}</td>
        <td class="num">${f2(t.trainRho)}</td>
        <td class="num">${t.p == null ? '—' : t.p.toFixed(4)}</td>
        <td class="num">${t.q == null ? '—' : t.q.toFixed(3)}</td>
        <td class="num">${f2(t.testRho)}</td>
        <td>${t.heldUp === true ? '<span class="good">held</span>'
          : t.heldUp === false ? '<span class="bad">no</span>' : '<span class="dim">—</span>'}</td>
        <td class="num dim">${t.trainN}/${t.testN}</td></tr>`).join('')}
      </table></div></details>` : '';

  return `<div class="card verdict ${cls[rep.headline.status] || ''}">
      <div class="headline">${esc(rep.headline.text)}</div></div>
    ${findings ? `<div class="card">${findings}</div>` : ''}
    <div class="card">${collapsed}${table}
      <p class="note" style="margin-top:10px">Nothing here is a result until it shows up
      again in sits recorded <em>after</em> today. Searching and confirming on the same
      data is how false findings get believed.</p></div>`;
}

/*
 * The handoff. Small, prose, and carrying its own guardrails — see findings.js for why
 * those matter more than the findings do.
 */
let lastReports = [];

function handoffBarHtml() {
  return `<div id="handoffBar"><div class="row">
    <button class="primary" id="copyHandoff">Copy findings for an AI</button>
    <button id="downloadHandoff">Download as .md</button>
    <button id="saveAnalysis">Save this analysis</button>
    <span class="note">Findings and sample sizes only — no raw signal, and it leads with
    what the data cannot support.</span></div></div>`;
}

/*
 * SAVED ANALYSES: append-only, dated, and never overwritten.
 *
 * Re-running the search after three more sits produces a NEW entry rather than replacing
 * the old one, and that is the whole value. A finding here is a candidate; the only thing
 * that makes it a result is turning up again in data recorded after it was found. That
 * comparison needs the earlier claim on record — including how many sits it rested on, so
 * a stronger later result can be told apart from simply having more data.
 */
function renderSaved() {
  const host = document.getElementById('saved');
  if (!host) return;
  if (!store) {
    host.innerHTML = storeError
      ? `<div class="card note">Not saving: ${esc(storeError)}. The analysis above still
         works — nothing here needs storage — but it will be gone on reload.</div>`
      : '';
    return;
  }
  LabStore.listAnalyses(store).then((rows) => {
    if (!rows.length) {
      host.innerHTML = `<h2>Saved analyses</h2><div class="card note">
        Nothing saved yet. Use <strong>Save this analysis</strong> above to keep a dated
        snapshot. The point is comparison: a pattern only becomes a result by turning up
        again in sits recorded after it was found, and that needs today's answer on
        record.</div>`;
      return;
    }
    host.innerHTML = `<h2>Saved analyses</h2><div class="card scroll"><table>
      <tr><th>When</th><th>Title</th><th>Sits</th><th>Findings</th><th></th></tr>
      ${rows.map((r) => {
        const found = (r.reports || []).reduce((n, x) =>
          n + ((x.report && x.report.confirmed) ? x.report.confirmed.length : 0), 0);
        return `<tr>
          <td>${esc(new Date(r.savedAt).toISOString().slice(0, 16).replace('T', ' '))}</td>
          <td>${esc(r.title)}</td>
          <td class="num">${r.sessionCount}</td>
          <td class="num">${found || '<span class="dim">none</span>'}</td>
          <td><button data-open-analysis="${r.id}">Open</button>
              <button data-dl-analysis="${r.id}">.md</button>
              <button data-del-analysis="${r.id}">Delete</button></td></tr>`;
      }).join('')}</table></div><div id="analysisView"></div>`;

    host.querySelectorAll('[data-open-analysis]').forEach((b) => {
      b.addEventListener('click', async () => {
        const rec = await LabStore.getAnalysis(store, Number(b.dataset.openAnalysis));
        const view = document.getElementById('analysisView');
        if (!rec || !view) return;
        /* Shown as the SAVED PROSE, not re-derived. Re-running the search to display an
           old snapshot would show today's answer under yesterday's date, which is the one
           thing a record must never do. */
        view.innerHTML = `<div class="card">
          <div class="note">Saved ${esc(new Date(rec.savedAt).toISOString().slice(0, 16).replace('T', ' '))}
            · ${rec.sessionCount} sit(s): ${esc((rec.sessions || []).map((x) => x.name).join(', ') || '—')}
            · this is what it said THEN, not a fresh run</div>
          <pre style="white-space:pre-wrap;margin:12px 0 0;font-size:12px;line-height:1.6">${esc(rec.markdown || '')}</pre>
        </div>`;
        view.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    host.querySelectorAll('[data-dl-analysis]').forEach((b) => {
      b.addEventListener('click', async () => {
        const rec = await LabStore.getAnalysis(store, Number(b.dataset.dlAnalysis));
        if (!rec) return;
        const url = URL.createObjectURL(new Blob([rec.markdown || ''], { type: 'text/markdown' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `analysis-${new Date(rec.savedAt).toISOString().slice(0, 16).replace(/[:T]/g, '-')}.md`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 20000);
      });
    });
    host.querySelectorAll('[data-del-analysis]').forEach((b) => {
      b.addEventListener('click', async () => {
        await LabStore.deleteAnalysis(store, Number(b.dataset.delAnalysis));
        renderSaved();
      });
    });
  }).catch((err) => {
    host.innerHTML = `<div class="card note">Could not read saved analyses:
      ${esc((err && err.message) || 'unknown')}</div>`;
  });
}

// One description of the input set, used by both the handoff and the saved record, so a
// snapshot can never claim a different set of sits than the prose inside it describes.
function sessionSummaryRows() {
  return sessions.filter((s) => !s.error).map((s) => ({
    name: s.file,
    minutes: s.durationSec == null ? null : Math.round(s.durationSec / 60),
    spans: (s.spans || []).filter((x) => x.dims).length,
    transitions: (s.notes || []).filter((n) => n.kind === 'transition').length,
    blocks: (s.trialBlocks || []).length,
  }));
}

function buildHandoff() {
  return Findings.handoff(lastReports, { sessions: sessionSummaryRows() });
}

function wireHandoff() {
  const copy = document.getElementById('copyHandoff');
  const dl = document.getElementById('downloadHandoff');
  const save = document.getElementById('saveAnalysis');
  if (save) {
    save.addEventListener('click', async () => {
      if (!store) { save.textContent = 'Storage unavailable'; return; }
      try {
        const rec = await LabStore.saveAnalysis(store, {
          title: `${sessions.filter((s) => !s.error).length} sit(s)`,
          reports: lastReports,
          markdown: buildHandoff(),
          sessions: sessionSummaryRows(),
        });
        save.textContent = 'Saved';
        renderSaved();
        void rec;
      } catch (err) {
        // Never a silent failure: a page that did not save looks exactly like one
        // that did.
        save.textContent = `Could not save: ${(err && err.message) || 'unknown'}`;
      }
      setTimeout(() => { save.textContent = 'Save this analysis'; }, 2500);
    });
  }
  if (copy) {
    copy.addEventListener('click', async () => {
      const md = buildHandoff();
      try {
        await navigator.clipboard.writeText(md);
        copy.textContent = `Copied (${(md.length / 1024).toFixed(1)}kB)`;
      } catch (e) {
        // A refused clipboard must not look like a successful copy.
        console.log(md);
        copy.textContent = 'In the console';
      }
      setTimeout(() => { copy.textContent = 'Copy findings for an AI'; }, 3000);
    });
  }
  if (dl) {
    dl.addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([buildHandoff()], { type: 'text/markdown' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'findings-handoff.md';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 20000);
    });
  }
}

/* Open the store and restore before the first render, so the page comes up with what was
 * left in it rather than empty-then-populated. Storage is additive: if it refuses, the
 * lab still works and says so. */
openStore().then(render);
</script>
