<!doctype html>
<meta charset="utf-8">
<title>Lab — session analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  THE LAB. Drop session .zip files in, look at them, label spans, search for patterns.

  Runs entirely offline from the filesystem, like the app: no build step, no server,
  no upload. That is not minimalism for its own sake — these files contain a
  recording of somebody's brain during meditation, and the design principle is that
  they never leave the machine unless their owner deliberately sends them.

  WHAT THIS IS FOR, and the thing to keep in mind while reading its output:
  every score the app displays is currently unvalidated. This is the only place that
  can change that, and the only way it can is by comparing what the algorithms
  claimed against what the person actually reported. So the labels are the data, and
  the features are the hypothesis — not the other way round.

  It will usually tell you there is nothing there. That is the expected result with a
  handful of sits, and it is a real finding rather than a failure of the tool.
-->
<style>
  :root {
    --bg: #07080d; --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.11);
    --text: #e8eaf0; --muted: rgba(232,234,240,.55); --dim: rgba(232,234,240,.35);
    --good: #7fd8a0; --warn: #ffd27a; --bad: #ff8f8f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 Inter,
    ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 28px clamp(16px, 4vw, 48px) 80px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px; letter-spacing: .01em; }
  h2 { font-size: 14px; font-weight: 600; margin: 30px 0 10px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; max-width: 62ch; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-top: 14px; }
  #drop { border: 1.5px dashed var(--line); border-radius: 14px; padding: 34px 20px;
    text-align: center; color: var(--muted); cursor: pointer; margin-top: 18px;
    transition: border-color .2s, background .2s; }
  #drop.over { border-color: var(--good); background: rgba(127,216,160,.07); }
  button { font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 8px;
    background: rgba(255,255,255,.08); color: inherit; border: 1px solid var(--line);
    cursor: pointer; }
  button:hover { background: rgba(255,255,255,.14); }
  button.primary { background: rgba(127,216,160,.16); border-color: rgba(127,216,160,.4); }
  button:disabled { opacity: .4; cursor: default; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line);
    white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; }
  td.num { font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line);

  .dim { color: var(--dim); }
  .verdict { font-size: 14px; line-height: 1.65; padding: 14px 16px; border-radius: 12px;

  canvas { width: 100%; height: 190px; display: block; border-radius: 10px;

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 11.5px;

  .legend i { display: inline-block; width: 11px; height: 2.5px; vertical-align: middle;

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .note { font-size: 12.5px; color: var(--muted); }
  /* Findings read as prose; the numbers hide behind a toggle. A table of correlations
     invites reading the biggest number as the answer, which is the mistake the whole
     analysis layer exists to prevent. */
  .finding { border-left: 2px solid var(--good); padding: 2px 0 2px 14px; margin: 16px 0; }
  .finding.weak { border-left-color: var(--warn); }
  .finding h4 { margin: 0 0 6px; font-size: 15px; font-weight: 600; line-height: 1.5; }
  .finding .meta { font-size: 12px; color: var(--dim); margin-top: 6px;

  details > summary { cursor: pointer; color: var(--muted); font-size: 12px;
    letter-spacing: .04em; margin-top: 6px; }
  .headline { font-size: 16px; line-height: 1.6; font-weight: 500; }
  #handoffBar { position: sticky; bottom: 0; padding: 12px 0; margin-top: 24px;

  /* ---- The shell ------------------------------------------------------------------
     A bar that says where you are, and tabs that say what there is. Both exist because this page
     used to be one scroll of six analyses with no indication of where to start. */
  #appBar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap;

  #appBar .barNote { margin-left: auto; font-size: 11.5px; }
  #places { display: flex; gap: 4px; }
  #places a, #places .here { padding: 5px 14px; border-radius: 9px; font-size: 13px;
    text-decoration: none; color: rgba(255,255,255,.62); }
  #places a:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
  #places .here { background: rgba(125,211,252,.14); color: #cbe9ff;

  #tabs { display: flex; gap: 2px; flex-wrap: wrap; margin: 14px 0 18px; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
    color: rgba(255,255,255,.55); font: inherit; font-size: 13.5px; padding: 8px 15px 9px; }
  .tab:hover { color: rgba(255,255,255,.85); }
  .tab.active { color: #cbe9ff; border-bottom-color: #7dd3fc; }
  .pane[hidden] { display: none; }

  /* ---- Explore --------------------------------------------------------------------
     A question, then sentences. The two-column split puts "how to read this" beside the answer
     rather than under it, because a caveat below the fold is a caveat nobody applies. */
  .askRow { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; margin-bottom: 12px; }
  .askRow select { flex: 1 1 260px; font: inherit; font-size: 14px; padding: 11px 12px;
    background: rgba(255,255,255,.05); color: inherit; border: 1px solid rgba(255,255,255,.14);
    border-radius: 11px; }
  .askRow button { font: inherit; font-size: 14px; padding: 11px 22px; border-radius: 11px;
    border: 1px solid rgba(125,211,252,.45); background: rgba(125,211,252,.16); color: #cbe9ff;
    cursor: pointer; }
  .askRow button:hover { background: rgba(125,211,252,.26); }
  .knobs { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px;

  .knobs label { display: flex; gap: 6px; align-items: center; color: rgba(255,255,255,.6); }
  .knobs select { font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 8px;

  .split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

  .finding { display: flex; gap: 13px; align-items: flex-start; padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,.06); }
  .finding:last-child { border-bottom: none; }
  .finding .glyph { flex: 0 0 26px; font-size: 17px; text-align: center; opacity: .8; }
  .finding .body { flex: 1 1 auto; min-width: 0; }
  .finding .say { line-height: 1.55; }
  .finding .why { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 5px; line-height: 1.5; }
  /* The badge carries the actual evidence — a count of sessions — so it is styled to be read, not
     skimmed past. Four states and no percentage: see explore.js on why there is no confidence figure. */
  .badge { display: inline-block; flex: 0 0 auto; font-size: 11.5px; padding: 4px 10px;
    border-radius: 999px; white-space: nowrap; }
  .badge.repeats { background: rgba(134,239,172,.14); color: #bbf7d0;
    box-shadow: inset 0 0 0 1px rgba(134,239,172,.28); }
  .badge.possible { background: rgba(253,224,71,.12); color: #fde68a;
    box-shadow: inset 0 0 0 1px rgba(253,224,71,.24); }
  .badge.unclear { background: rgba(255,255,255,.06); color: rgba(255,255,255,.6);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .badge.insufficient { background: rgba(148,163,184,.12); color: #cbd5e1;
    box-shadow: inset 0 0 0 1px rgba(148,163,184,.26); }
  .sideHead { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.45); margin-bottom: 9px; }
  .keyRow { display: flex; gap: 9px; font-size: 12.5px; margin-bottom: 8px; line-height: 1.45; }
  .keyRow .k { flex: 0 0 auto; }
  /* The row expander. A button rather than a link so it is reachable by keyboard, and monospaced so
     the triangle does not shift the column width when it turns. */
  .expander { background: none; border: none; cursor: pointer; color: rgba(255,255,255,.55);
    font: 13px ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; }
  .expander:hover { background: rgba(255,255,255,.08); color: #cbe9ff; }
  tr.sesDetail > td { padding-top: 0; }
  .why { font-size: 12px; color: rgba(255,255,255,.5); line-height: 1.5; }
</style>

<!--
  A VISIBLE FAILURE, AND CACHE-BUSTING — both of which this page was missing entirely.

  direct.html got these after two outages where one bad module took the whole app down silently. The lab
  never did, and it produced the identical report: "the lab doesn't seem to work at all... the tabs don't
  work and the add session button doesn't work." Every renderer runs from one render() call, so a single
  module failing to load — a browser holding a cached copy from before explore.js existed — throws there
  and takes the tabs and the file input with it, with nothing on screen to say why.
-->
<script>
(function () {
  window.addEventListener('error', function (e) {
    try {
      var el = document.getElementById('bootError');
      if (!el) {
        el = document.createElement('div');
        el.id = 'bootError';
        el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#5a1420;'
          + 'color:#ffd9df;font:13px/1.5 system-ui,sans-serif;padding:10px 14px;'
          + 'border-bottom:1px solid #a33;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(el);
      }
      el.textContent = 'The lab failed to start, so the tabs and the file picker will not work.\n'
        + ((e && e.message) || 'unknown error')
        + (e && e.filename ? '\n  at ' + e.filename + ':' + e.lineno : '')
        + '\n\nThis is almost always a stale cached file. Reload with Shift held.';
    } catch (err) { /* nothing left to try */ }
  });
}());
</script>

<!-- So the lab can read the app's own recordings instead of asking for an upload. Same origin, same
     database; see listAppSits(). export.js rebuilds each one into archive bytes so a saved sit and a
     dropped file go through one parse. -->
<script src="record.js?v=2026-08-04f"></script>
<script src="export.js?v=2026-08-04f"></script>
<script>
/*
 * Sessions are held in memory AND persisted — see labstore.js.
 *
 * They used to be memory-only, on the reasoning that the app owns the durable copy and a
 * second store would be a second thing to keep in sync. That was wrong about the thing
 * that matters: a finding here is only ever a candidate, and the only way a candidate
 * becomes a result is by showing up again in later sits. Comparing this month's search
 * against last month's is the entire method, and it is impossible if the earlier answer
 * was never written down.
 *
 * What is stored is the PARSED session, not the archive — raw EEG is about a thousand
 * times larger than the rows any view reads. See trimForStore.
 */
const sessions = [];
let store = null;          // the IndexedDB handle, or null if storage is unavailable
let storeError = null;
const dropEl = document.getElementById('drop');
const fileEl = document.getElementById('file');
const loadedEl = document.getElementById('loaded');
const alphaEl = document.getElementById('alpha');
const wholeEl = document.getElementById('whole');
const outEl = document.getElementById('out');

const esc = (s) => String(s == null ? '' : s)
  .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = (sec) => sec == null ? '—'
  : `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
const f2 = (v) => v == null ? '—' : v.toFixed(2);

dropEl.addEventListener('click', () => fileEl.click());
dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('over'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
dropEl.addEventListener('drop', (e) => {
  e.preventDefault();
  dropEl.classList.remove('over');
  load(Array.from(e.dataTransfer.files));
});
fileEl.addEventListener('change', () => load(Array.from(fileEl.files)));

const handedOver = [];   // names of sits the app passed straight over, for the notice
/* Which rows are opened. A Set of indexes rather than a flag on the session, because the session
   objects are persisted and a UI toggle has no business surviving a reload. */
const expanded = new Set();

async function load(files) {
  for (const f of files) {
    if (!/\.zip$/i.test(f.name)) continue;
    await ingest(f.name, new Uint8Array(await f.arrayBuffer()));
  }
  await persist();
  render();
}

/* ONE INGEST PATH for a dropped file and for an archive handed over by the app. Two
 * paths that are meant to agree eventually stop agreeing. */
/*
 * The identity of a RECORDING, independent of its filename.
 *
 * First attempt was the start time plus the row count, on the reasoning that two recordings
 * cannot begin at the same millisecond. True of real sits and false of test fixtures — two
 * different synthetic sits built from the same nominal start collided, and the duplicate check
 * threw away real data. That is the failure mode that matters: a check which rejects genuine
 * sessions is worse than no check, because the loss is silent from the analysis's point of view.
 *
 * So the key includes a cheap hash of the CONTENT as well. FNV-1a over a sample of the numeric
 * columns — every row if there are few, otherwise a fixed stride so cost stays bounded on a
 * 40-minute sit. Sampling by stride rather than by prefix on purpose: two sits that begin
 * identically and diverge later are exactly the pair a prefix hash would confuse.
 */
function recordingKey(read) {
  const rows = (read && read.metrics) || [];
  if (!rows.length) return null;
  const startMs = Number(rows[0].epochMs);
  let h = 0x811c9dc5;
  const stride = Math.max(1, Math.floor(rows.length / 64));
  for (let i = 0; i < rows.length; i += stride) {
    const r = rows[i];
    for (const k of Object.keys(r)) {
      const str = String(r[k]);
      for (let j = 0; j < str.length; j++) {
        h ^= str.charCodeAt(j);
        h = (h * 0x01000193) >>> 0;
      }
    }
  }
  const stamp = Number.isFinite(startMs) ? startMs : 'nostamp';
  return `${stamp}:${rows.length}:${h.toString(16)}`;
}

/* Sits refused as duplicates, reported by name — a file that silently vanished on drop would
   look like the drop having failed. */
const duplicates = [];

async function ingest(name, bytes, { recorderId = null } = {}) {
  {
    const f = { name };
    try {
      const read = await Importer.readSessionArchive(bytes);
      // Derive the label spans once, here, so every downstream view agrees about
      // which stretch of time each label describes.
      const notes = read.notes.map((n) => ({
        offsetSec: n.offsetSec, anchored: n.anchored === 'no' ? false : true,
        kind: n.kind, transition: n.transition, text: n.text,
        dims: Labels.normalise({ focus: n.focus, effort: n.effort, pull: n.pull, tone: n.tone }),
      }));
      const duration = read.metrics.length ? read.metrics[read.metrics.length - 1].t : null;
      const { spans, wholeSit } = Labels.spans(notes, { durationSec: duration });
      /* Trial blocks, rebuilt from the recorded boundaries rather than from the
       * protocol definition. If a run was cut short, or the app was reloaded, or a
       * block was missed, the record says so and the definition would not — so the
       * data is the authority on what actually happened.
       */
      const blockNotes = read.notes
        .filter((n) => n.kind === 'block' && n.condition != null && n.offsetSec != null)
        .sort((a, b) => a.offsetSec - b.offsetSec);
      const trialBlocks = blockNotes.map((n, i) => {
        const proto = Trials.BY_KEY[n.trialKey];
        const next = blockNotes[i + 1];
        // The block ends where the next one starts. Falling back to the protocol's
        // nominal length only for the final block, which has no successor.
        const toSec = next ? next.offsetSec
          : (proto ? n.offsetSec + proto.blockSec : (duration || n.offsetSec));
        const settle = proto ? proto.settleSec : 0;
        return { condition: n.condition, trialKey: n.trialKey, blockIndex: n.blockIndex,
          fromSec: n.offsetSec, analyseFromSec: n.offsetSec + settle, toSec };
      });
      /* INDIVIDUAL ALPHA PEAK, and the 4-second spectral series built on it — computed
       * HERE, at ingest, because this is the only moment the raw EEG is in hand. The store
       * keeps the parsed session and drops raw EEG (a thousand times larger than anything
       * a view reads), so anything that needs samples has to be derived before that. The
       * results are small and are persisted, so a restored session still knows its own
       * alpha peak without the archive. */
      const hasRaw = !!(read.eeg && read.eeg.some((c) => c && c.length));
      const alpha = hasRaw ? DSP.alphaPeakByChannel(read.eeg, read.eegHz) : null;
      const spectra = hasRaw ? spectralRows(read.eeg, read.eegHz, alpha.band) : null;
      /* MOVEMENT, from the accelerometer — computed here for the same reason as the alpha peak:
       * acc.csv is parsed on ingest and dropped by the store, so anything derived from it has
       * to be derived now. The summary is a few hundred bytes; the event list is not kept. */
      const movement = (read.acc && read.acc.length)
        ? Movement.summarise(Movement.analyse(read.acc)) : null;
      // Whole-sit descriptors, so a session can be compared as a session rather than only at
      // its marks. Computed once here so every view agrees about them.
      const wholeStats = sessionStats({ read, notes, spans, durationSec: duration, movement });
      /*
       * THE SAME SIT MUST NOT BE LOADED TWICE, and this is a correctness problem rather than
       * tidiness.
       *
       * A real findings report listed `meditation-2026-07-29-2151.zip` twice and both
       * `meditation-2026-07-27-2346.zip` and `meditation-2026-07-27-2346 (1).zip` — the second
       * being what a browser names a re-download. The session id is the FILENAME, so those are
       * two different sessions as far as everything downstream is concerned, and two things go
       * wrong at once:
       *
       *   - n is inflated. The same twenty windows are counted twice, so every p-value is
       *     computed against an observation count that does not exist.
       *   - The train/test split leaks. One copy can land in training and the other in the
       *     held-out set, which is EXACTLY the leak splitting by session exists to prevent. A
       *     finding "confirmed on data it was not fitted on" would have been confirmed on the
       *     same seconds it was fitted on.
       *
       * Identity therefore comes from the RECORDING, not the file: when it started, in absolute
       * epoch milliseconds, plus how many rows it has. Two files of the same sit agree on both;
       * two genuinely different sits cannot, since a recording begins at one instant.
       */
      const contentKey = recordingKey(read);
      if (contentKey) {
        const twin = sessions.find((x) => x.contentKey === contentKey);
        if (twin) {
          duplicates.push({ file: f.name, sameAs: twin.file });
          // `return`, not `continue`: ingest handles one file per call, and this one is done.
          return;
        }
      }
      /*
       * THE SIT'S NAME COMES FROM ITS OWN NOTE.
       *
       * Asked for: "for naming the sits, if there's a note you can use the note. that's where i've
       * been naming the sit." Exactly right, and it was already in every archive — the general note
       * ("very relaxed, post sleep, post meditation, day 3 retreat") is a better name than any filename
       * and it is written at the one moment the sit is still fresh.
       *
       * The GENERAL note specifically: `anchored === false` means it describes the whole sit rather
       * than a moment in it. A timed mark's text would name the sit after one thing that happened
       * inside it, which is worse than the filename.
       */
      const general = (read.notes || []).find((n) =>
        (n.anchored === 'no' || n.anchored === false) && n.text && String(n.text).trim());
      const fromNote = general ? String(general.text).trim().replace(/\s+/g, ' ') : '';
      sessions.push({
        contentKey,
        /* WHICH RECORDING ON THIS DEVICE THIS IS, when it came from one. Persisted, and the
           reason the sits list can tell an analysed sit from an unanalysed one without
           parsing anything — which is what made the boot-time analysis look unavoidable.
           Null for a dropped archive, which may well have come off another machine. */
        recorderId,
        sessionId: f.name, file: f.name, read, notes, spans, wholeSit, trialBlocks,
        durationSec: duration, alpha, spectra, movement, wholeStats,
        // Only as a DEFAULT: a name typed into the list later must win, so setLabel() overwrites it.
        label: fromNote.slice(0, 120) || '',
      });
    } catch (err) {
      // A bad archive must be reported by name. Silently skipping it would mean
      // analysing fewer sessions than the screen appears to show.
      sessions.push({ sessionId: f.name, file: f.name, error: err.message || 'could not read' });
    }
  }
}

/* Storage is ADDITIVE: the lab works fully without it, and a refusal (private mode, a
 * full quota) must not cost the analysis that is already on screen. It does have to be
 * visible though — a page that silently is not saving looks identical to one that is. */
async function openStore() {
  try {
    store = await LabStore.open();
    const restored = await LabStore.loadSessions(store);
    for (const r of restored) {
      /* WHOLE-SIT STATS FOR RESTORED SESSIONS TOO. Reported as "i don't see the analysis of the
       * whole session yet" — and the section really was empty, because it only renders sessions
       * carrying `wholeStats`, and those were computed at ingest. Every sit already in storage
       * from before that existed had none, so the whole feature was invisible to exactly the
       * person who had been recording all along.
       *
       * The series statistics can be rebuilt from the stored rows, so they are. Movement cannot:
       * it needs acc.csv, which the store drops. A restored session therefore shows its scores
       * and says its movement is unavailable, rather than vanishing from the comparison. */
      if (!r.wholeStats) {
        r.wholeStats = sessionStats({ read: r.read || {}, notes: r.notes || [],
          spans: r.spans || [], durationSec: r.durationSec, movement: r.movement || null });
      }
      sessions.push(r);
    }
    /* Anything the app handed over since last time. Ingested through the SAME path as a
     * dropped file — it is the same archive bytes — so there is only ever one parse to
     * keep correct. */
    const incoming = await LabStore.takeIncoming(store);
    for (const item of incoming) {
      await ingest(item.name, item.bytes);
      handedOver.push(item.name);
    }
    if (incoming.length) await persist();
  } catch (err) {
    storeError = (err && err.message) || 'unavailable';
    console.log('[lab] storage unavailable:', storeError);
  }
  /* The app's own recordings — LISTED, not analysed. Metadata only, so this stays in the
     milliseconds however much EEG is stored. See the long note on listAppSits. */
  await listAppSits();
}

/* ==========================================================================
 * THE SITS ARE ALREADY ON THIS MACHINE — LIST THEM CHEAPLY, ANALYSE ON DEMAND
 * ==========================================================================
 * Asked for: "since everything's saved in the site, instead of uploading everything could we just have
 * the files there ready for me to select? or even just autoload them when i finish a recording and give
 * me the option to exclude by clicking the x in the Loaded table?"
 *
 * Right, and the upload step was never necessary. The app and the lab are the same origin, so the
 * recordings the app wrote are readable from here directly.
 *
 * WHY THIS IS NOW TWO FUNCTIONS INSTEAD OF ONE. Reported as "the lab is still freezing even after a
 * hard reload", and the hard reload is the tell: this was never a caching problem. The previous
 * version analysed the twelve most recent sits on page load, and analysing a sit means reading its
 * raw EEG out of IndexedDB, rebuilding it into an archive, parsing that back, and running an alpha
 * peak and a spectral series over the samples. Measured in headless Chromium on a fast machine:
 *
 *     8 sits x 30 min    9.3s before the page showed a single row
 *    14 sits x 40 min   19.9s
 *
 *   of which, per load:  alphaPeakByChannel 3.7s · bandSeries 1.9s · loadSession 1.4s
 *                        readSessionArchive 0.9s · buildFiles 0.4s · zip 0.3s
 *
 * Identical on the second and third load, because none of it was cached. On a Chromebook or a phone
 * that is minutes, it grows with every sit recorded, and it happens before anything is on screen — so
 * the page is indistinguishable from one that has crashed.
 *
 * So the two jobs are separated:
 *
 *   listAppSits()   metadata only. Recorder.listSessions reads the sessions and notes stores and
 *                   never touches a chunk, so it is milliseconds regardless of how much EEG is
 *                   stored. It yields everything the list needs to be useful — the general note as
 *                   the sit's name, length, mark tally by kind — which is most of what the sits list
 *                   was ever showing.
 *
 *   analyseSits()   the expensive derivation, for sits the reader has actually chosen, with progress
 *                   on screen and a cancel button. Once done, the result is persisted by LabStore and
 *                   never recomputed: a sit is analysed once, ever, not once per page load.
 *
 * STILL THROUGH THE SAME INGEST PATH. Each session is rebuilt into archive bytes and handed to
 * ingest(), rather than shortcutting into the session list. That round trip is ~1.2s of the per-sit
 * cost and it would be tempting to skip, but a second ingest path is a second thing to keep correct
 * and this project has already paid four times for a reader that agreed with its own writer. It is
 * paid once per sit now instead of once per page load, which is the difference that mattered.
 *
 * NO CEILING ANY MORE. There was an AUTOLOAD_MAX of 12 because loading was unbounded work on boot;
 * with nothing loaded on boot there is nothing to cap, and every sit on the device is listed. A
 * silently truncated list was its own hazard — "silently analysing a subset while appearing to
 * analyse everything is the failure mode that matters here" was true, and now there is no subset.
 */
const appSits = { available: [], error: null, listed: false };

/* Progress for the on-demand analysis. On the state object rather than in the DOM so a re-render
   cannot lose track of a run that is still going. */
const analysing = { active: false, done: 0, total: 0, current: '', cancel: false, failed: [] };

/*
 * EXCLUSION IS A DECISION AND IT PERSISTS.
 *
 * "give me the option to exclude by clicking the x". Pressing × used to drop the sit from the
 * in-memory list and from the lab's store — which worked until the next reload, when the sit was
 * read from the app again and came straight back. That reads as the button not working.
 *
 * Kept by RECORDING id, in localStorage, separately from whether the sit has been analysed. It does
 * not delete the recording and it is reversible, so the list shows what has been set aside rather
 * than pretending those sits do not exist.
 */
const EXCLUDE_KEY = 'zenbio.lab.excluded';
let excluded = new Set();
try {
  const raw = localStorage.getItem(EXCLUDE_KEY);
  if (raw) excluded = new Set(JSON.parse(raw));
} catch (err) { /* private mode, a full quota — the lab works without it */ }
function saveExcluded() {
  try { localStorage.setItem(EXCLUDE_KEY, JSON.stringify(Array.from(excluded))); }
  catch (err) { /* additive */ }
}

async function listAppSits() {
  if (typeof Recorder === 'undefined' || typeof Exporter === 'undefined') return;
  let db = null;
  try {
    db = await Recorder.open();
    const list = await Recorder.listSessions(db);
    appSits.available = list.map((m) => ({
      id: m.id, startedAt: m.startedAt, durationSec: m.durationSec || 0,
      label: m.label || '', marks: m.markCount || 0, markTally: m.markTally || [],
      bytes: m.bytes || 0, simulated: !!m.simulated, recovered: !!m.recovered,
      // The name the sit gave itself. See the note in record.js on why this is free here.
      generalNote: m.generalNote || '',
      /* The name the archive WOULD have. Computed from startedAt and the simulated flag alone, so
         matching an app sit against an already-analysed one costs no parsing. It is the fallback for
         records written before `recorderId` was stored; new ones match on the id itself. */
      archiveName: Exporter.archiveName(m),
      // A sit with no scored rows cannot contribute to any analysis. Listed anyway, and said so in
      // the row: a recording that vanished from the list would look like data loss.
      tooShort: (m.durationSec || 0) < 20,
    }));
    appSits.listed = true;
  } catch (err) {
    appSits.error = (err && err.message) || 'could not read the app’s recordings';
    console.log('[lab] listAppSits:', appSits.error);
  } finally {
    if (db && db.close) db.close();
  }
}

/* Which analysed session, if any, corresponds to a sit on the device. Exact by recorderId where it
   was recorded; by archive name for sessions analysed before that field existed. */
function analysedFor(sit) {
  if (!sit) return null;
  return sessions.find((s) => !s.error
    && ((s.recorderId && s.recorderId === sit.id) || s.file === sit.archiveName)) || null;
}
function isAnalysed(sit) { return !!analysedFor(sit); }

// Let the browser paint. Each sit's derivation is ~1.2s of unbroken synchronous work, so without a
// yield between them the progress counter would jump from 0 to done in one frame.
function paint() {
  return new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));
}

/*
 * Analyse a chosen set of sits, one at a time, with the screen kept alive between them.
 *
 * Sequential on purpose. Each sit peaks at its own raw EEG plus an archive copy of it in memory, and
 * running several at once on a phone is how a tab gets killed for memory rather than for time.
 */
async function analyseSits(ids) {
  const todo = ids.filter((id) => {
    const sit = appSits.available.find((a) => a.id === id);
    return sit && !isAnalysed(sit) && !sit.tooShort;
  });
  if (!todo.length || analysing.active) return;
  Object.assign(analysing, { active: true, done: 0, total: todo.length, current: '', cancel: false, failed: [] });
  render();
  let db = null;
  try {
    db = await Recorder.open();
    for (const id of todo) {
      if (analysing.cancel) break;
      const sit = appSits.available.find((a) => a.id === id);
      analysing.current = sitName(sit);
      renderProgress();
      await paint();
      try {
        const loaded = await Recorder.loadSession(db, id);
        if (!loaded || !loaded.rows || !loaded.rows.length) {
          analysing.failed.push({ name: sitName(sit), why: 'no scored rows in the recording' });
        } else {
          const { files } = Exporter.buildFiles({
            meta: loaded.meta, eeg: loaded.eeg, acc: loaded.acc, rr: loaded.rr,
            rows: loaded.rows, notes: loaded.notes,
            headAcc: loaded.headAcc, headRaw: loaded.headRaw,
          }, {});
          const bytes = new Uint8Array(Exporter.zip(files, { date: new Date(sit.startedAt) }));
          // ingest() refuses a duplicate by content hash, so a sit already dropped in by hand is not
          // analysed twice — the same guard that stops the same seconds landing on both sides of a
          // train/test split.
          await ingest(Exporter.archiveName(loaded.meta), bytes, { recorderId: id });
        }
      } catch (err) {
        /* NAMED, NOT SWALLOWED. A sit that failed to analyse and a sit nobody selected look identical
           in the list otherwise, and the difference decides whether a comparison is missing data. */
        analysing.failed.push({ name: sitName(sit), why: (err && err.message) || 'could not read it' });
        console.log('[lab] could not analyse', id, err && err.message);
      }
      analysing.done++;
      renderProgress();
    }
    await persist();
  } catch (err) {
    appSits.error = (err && err.message) || 'could not read the app’s recordings';
  } finally {
    if (db && db.close) db.close();
    analysing.active = false;
    analysing.current = '';
    render();
  }
}

/* The sit's name, from the best thing available: its own general note, then a label typed in the app,
   then when it was. Never the filename — a reader comparing sits by filename is comparing strings. */
function sitName(sit) {
  if (!sit) return 'a sit';
  if (sit.generalNote) return sit.generalNote;
  if (sit.label) return sit.label;
  return sit.startedAt ? new Date(sit.startedAt).toLocaleString() : 'a sit';
}

async function persist() {
  if (!store) return;
  try { await LabStore.putSessions(store, sessions.filter((s) => !s.error)); }
  catch (err) { storeError = (err && err.message) || 'could not save'; }
}

/* ==========================================================================
 * THE 4-SECOND SERIES, RECOMPUTED FROM RAW EEG
 * ==========================================================================
 * "do individual alpha peak and four-second lab windows. Keep one-second windows for the
 * live display."
 *
 * These are a different kind of column from metrics.csv's. metrics.csv is what the app
 * computed while the sit was happening, at 1Hz from 1-second windows — which is 1Hz
 * frequency resolution, five bins across the whole of alpha, and no way to tell 9.5Hz from
 * 10.5Hz. That is fine for a live display and useless for a question about where someone's
 * alpha actually sits. These rows are recomputed from the raw samples in 4-second windows
 * (0.25Hz bins) using the individual alpha band measured from this session.
 *
 * Both are kept and the analysis views choose between them, rather than one replacing the
 * other: metrics.csv carries the composite scores and the strap, and has four times the
 * time resolution; this carries real per-electrode spectra and a band that means something
 * for this person. A view that silently mixed them would be comparing 1s and 4s windows.
 */
const round4 = (v) => (v == null || !Number.isFinite(v) ? null : Number(v.toFixed(4)));

function spectralRows(eeg, hz, band) {
  const out = DSP.bandSeries(eeg, hz, { alphaBand: band });
  const rows = out.rows.map((r) => {
    // `t` rather than `tSec`, so these rows are the same shape as metrics.csv's and every
    // downstream view can read either without knowing which it has.
    const row = { t: Number(r.tSec.toFixed(3)) };
    let relSum = 0, relN = 0;
    r.channels.forEach((c, i) => {
      const name = DSP.CHANNEL_NAMES[i] || `ch${i}`;
      if (!c) return;                  // a bad window leaves this channel's columns absent
      const rel = c.total > 0 ? c.alpha / c.total : null;
      /* LOG POWER, not raw. Band power spans orders of magnitude and is roughly
         log-normal, so a mean or a plotted average of raw power is dominated by its
         largest few windows. The search is rank-based (Spearman) and cannot tell the
         difference, but the clip library averages traces, and there it matters. */
      row[`${name} alphaLog`] = round4(Math.log10(Math.max(1e-12, c.alpha)));
      row[`${name} thetaLog`] = round4(Math.log10(Math.max(1e-12, c.theta)));
      row[`${name} betaLog`] = round4(Math.log10(Math.max(1e-12, c.beta)));
      // Relative alpha: alpha as a share of 1-30Hz. Immune to overall amplitude, which
      // drifts with electrode contact over a long sit and is not a brain state.
      row[`${name} alphaRel`] = round4(rel);
      row[`${name} alphaRatio`] = round4(c.alpha / (c.alpha + c.beta + 1e-12));
      if (rel != null) { relSum += rel; relN++; }
    });
    // One headline column across whatever channels were clean in this window, so there is
    // something to search without picking an electrode first.
    if (relN) row['alphaRel avg'] = round4(relSum / relN);
    return row;
  });
  return { windowSec: out.windowSec, binHz: out.binHz, alphaBand: out.alphaBand, rows };
}

/* Which rows the analysis views read. One accessor, because the alternative is seven call
   sites that can disagree about it. Sessions with no recomputed series fall back to
   metrics.csv and say so rather than dropping out of the analysis silently. */
let analysisSource = 'metrics';      // 'metrics' | 'spectra'
function rowsOf(s) {
  if (analysisSource === 'spectra' && s.spectra && s.spectra.rows.length) return s.spectra.rows;
  return s.read.metrics || [];
}
function sourceLabel() {
  return analysisSource === 'spectra'
    ? '4s windows recomputed from raw EEG'
    : '1s rows from metrics.csv';
}
function sessionsWithoutSpectra() {
  return sessions.filter((s) => !s.error && !(s.spectra && s.spectra.rows.length));
}

/* ==========================================================================
 * THE SHELL: which pane is showing
 * ==========================================================================
 * Tabs rather than one long scroll. The reason is the report — "the lab is a bit hard to use for a
 * novice like that" — and the fix is not prettier cards, it is that the first thing on screen should be
 * a question rather than the sixth-most-important table.
 */
let pane = 'sessions';
function showPane(next) {
  pane = next;
  for (const el of document.querySelectorAll('.pane')) el.hidden = el.dataset.pane !== next;
  for (const el of document.querySelectorAll('.tab')) el.classList.toggle('active', el.dataset.tab === next);
  /* Still re-renders on switch: a pane that was hidden when its data arrived may have been drawn into a
     zero-width box, and canvases in particular measure wrong there. Cheap, and it removes a whole class
     of "the chart is blank until I resize" bug. */
  render();
}
for (const el of document.querySelectorAll('.tab')) {
  el.addEventListener('click', () => showPane(el.dataset.tab));
}

/* ==========================================================================
 * EXPLORE — a question, then sentences
 * ==========================================================================
 * The logic is in explore.js, deliberately: it is the part that can overclaim, so it lives where it can
 * be tested without a browser. This function only asks it things and prints what comes back.
 *
 * Every mark kind present across the loaded sits becomes an answerable question. Nothing here invents a
 * category — if a kind was never tapped, it is not offered.
 */
const exploreState = { question: 'before-mark', experience: null, other: null, windowSec: 20 };

// Marks per sit, keyed by kind, in session-clock seconds. One pass over the notes, reused by every
// question, because doing it inside the loop below would rescan every archive per signal.
function markTimesByKind() {
  const byKind = {};
  for (const s of sessions) {
    if (s.error) continue;
    for (const n of (s.read && s.read.notes) || []) {
      const kind = n.tapCategory || n.transition || n.markKind || n.kind;
      const t = Number(n.offsetSec);
      if (!kind || !Number.isFinite(t)) continue;      // a general note has no moment
      if (!byKind[kind]) byKind[kind] = {};
      if (!byKind[kind][s.sessionId]) byKind[kind][s.sessionId] = [];
      byKind[kind][s.sessionId].push(t);
    }
  }
  return byKind;
}

/* Two explanations joined into readable prose. Without it the badge's reason ran straight into the
   signal's caveat with no full stop between them — "3 are needed before a count means anything CANNOT
   be compared between sits" — which reads as one broken sentence rather than two true ones. */
function sentenceJoin(a, b) {
  const first = String(a || '').trim();
  const second = String(b || '').trim();
  if (!second) return first;
  if (!first) return second;
  return first + (/[.!?]$/.test(first) ? '' : '.') + ' ' + second;
}

function kindLabelFor(kind) {
  const t = (typeof Probes !== 'undefined' && Probes.TAP_BY_KEY && Probes.TAP_BY_KEY[kind])
    || (typeof Labels !== 'undefined' && Labels.TRANSITION_BY_KEY && Labels.TRANSITION_BY_KEY[kind]);
  return (t && t.label) || kind;
}

function renderExplore() {
  const host = document.getElementById('explore');
  if (!host) return;
  const usable = sessions.filter((s) => !s.error);
  if (!usable.length) {
    host.innerHTML = `<h2>What do you want to understand?</h2>
      <div class="card note">Drop some session archives above and this will fill in. Several at once
      is much better than one: every question here is answered by how many separate sits agree, so a
      single sit cannot answer any of them.</div>`;
    return;
  }
  const byKind = markTimesByKind();
  // Kinds ordered by how much evidence they carry — a kind marked three times cannot answer anything,
  // and putting it first would invite the reader to ask a question that has no answer.
  const kinds = Object.keys(byKind).map((k) => {
    const perSit = byKind[k];
    const sits = Object.keys(perSit).filter((id) => perSit[id].length >= Explore.MIN_MARKS_PER_SESSION);
    const total = Object.values(perSit).reduce((a, v) => a + v.length, 0);
    return { kind: k, label: kindLabelFor(k), sits: sits.length, total };
  }).sort((a, b) => b.sits - a.sits || b.total - a.total)
    /* ONLY KINDS THAT CAN ANSWER SOMETHING.
       The first version offered every kind found in the archives, including "text · 9 marks in 0 sits"
       and "voice · 3 marks in 0 sits" — general notes and voice memos, which are not moments at all —
       plus kinds tapped once. Offering a question with no possible answer is worse than not offering it:
       the reader picks it, gets "not enough", and cannot tell that from a real null. */
    .filter((k) => k.sits >= 1 && k.kind !== 'text' && k.kind !== 'voice');

  if (!kinds.length) {
    host.innerHTML = `<h2>What do you want to understand?</h2>
      <div class="card note">These sits carry no timed marks, so there is nothing to ask about yet.
      A mark is what turns a recording into data: it says <em>this moment was like that</em>, and every
      question on this page compares marked moments against the rest of the sit.</div>`;
    return;
  }
  if (!exploreState.experience || !byKind[exploreState.experience]) {
    exploreState.experience = kinds[0].kind;
  }

  const q = Explore.QUESTIONS.find((x) => x.key === exploreState.question) || Explore.QUESTIONS[0];
  const expLabel = kindLabelFor(exploreState.experience);

  const questionOptions = Explore.QUESTIONS.filter((x) => x.needs !== 'two-marks' || kinds.length > 1)
    .map((x) => `<option value="${x.key}"${x.key === q.key ? ' selected' : ''}>`
      + `${esc(x.ask.replace('{experience}', expLabel).replace('{other}', 'another mark'))}</option>`)
    .join('');
  const kindOptions = kinds.map((k) => `<option value="${esc(k.kind)}"`
    + `${k.kind === exploreState.experience ? ' selected' : ''}>`
    + `${esc(k.label)} · ${k.total} marks in ${k.sits} sit${k.sits === 1 ? '' : 's'}</option>`).join('');

  // ---- Ask it, for every signal that any loaded sit actually carries.
  const marks = byKind[exploreState.experience] || {};
  const win = q.key === 'after-mark'
    ? { preSec: 0, postSec: exploreState.windowSec }
    : { preSec: exploreState.windowSec, postSec: 0 };
  /* THE COMPARISON: another kind of mark, or the rest of the sit.
     Asked for, and it is the better question — "a better comparison would be to compare marks to other
     marks, not randomness." Against the rest of the sit, almost anything reads as different, because the
     unmarked remainder contains settling in, shifting posture, the first minute and the last. Against
     another kind of mark, all of that is held constant. See sessionVote() in explore.js. */
  const otherKinds = kinds.filter((k) => k.kind !== exploreState.experience);
  if (q.key === 'between-marks' && (!exploreState.other
      || exploreState.other === exploreState.experience
      || !otherKinds.some((k) => k.kind === exploreState.other))) {
    exploreState.other = otherKinds.length ? otherKinds[0].kind : null;
  }
  const againstTimes = q.key === 'between-marks' && exploreState.other
    ? (byKind[exploreState.other] || {}) : null;
  const otherLabel = exploreState.other ? kindLabelFor(exploreState.other) : '';
  const sits = usable.map((s) => ({ id: s.sessionId, label: displayName(s), rows: s.read.metrics }));
  const answers = [];
  for (const sig of Explore.SIGNALS) {
    // Skip a signal no loaded sit has any reading for: an "unclear" row for a sensor that was never
    // worn reads as a null result when it is an absence.
    const present = sits.some((x) => (x.rows || []).some((r) =>
      r[sig.key] != null && r[sig.key] !== '' && Number.isFinite(Number(r[sig.key]))));
    if (!present) continue;
    // metrics.csv arrives as strings; coerce once here rather than inside explore.js, which should not
    // know where its rows came from.
    const typed = sits.map((x) => ({ id: x.id, label: x.label,
      rows: (x.rows || []).map((r) => ({ t: Number(r.t), [sig.key]: r[sig.key] === '' || r[sig.key] == null
        ? null : Number(r[sig.key]) })) }));
    answers.push(Explore.askAcrossSessions(typed,
      { signalKey: sig.key, markTimes: marks, againstTimes, window: win }));
  }
  const order = { repeats: 0, possible: 1, unclear: 2, insufficient: 3 };
  answers.sort((a, b) => order[a.strength.key] - order[b.strength.key]);

  /* WHEN EVERY AVAILABLE SIGNAL IS A RELATIVE ONE, SAY SO ABOVE THE ANSWERS.
     Found by running this against seven real archives: the only signals present were `calm` and
     `thinking`, both rescaled within their own sit, so the screen was quietly answering a
     between-sits question with numbers that cannot be compared between sits. The comparable columns —
     alpha share, breathing rate, HRV in real units — did not exist when those sits were recorded.
     Silence here would read as "the lab found nothing", when the truth is "this data cannot answer
     it, and the next sit can". Those are different, and only one of them is actionable. */
  const comparable = answers.filter((a) => (Explore.SIGNAL_BY_KEY[a.signalKey] || {}).comparable);
  const missingComparable = !comparable.length && answers.length
    ? `<div class="card note bad">Every signal these archives carry is rescaled <em>within</em> its own
       sit, so none of it can be compared between sits. The comparable measurements — alpha share,
       breathing rate, HRV in milliseconds — are recorded from now on but were not in these files.
       Record one more sit and this question becomes answerable.</div>`
    : '';

  const GLYPH = { calmAbs: '◇', calm: '◇', thinking: '◇', breathPerMin: '∿', hrvMs: '♡', hrBpm: '♡' };
  const findings = answers.length ? answers.map((a) => {
    const sig = Explore.SIGNAL_BY_KEY[a.signalKey] || {};
    return `<div class="finding">
      <div class="glyph">${GLYPH[a.signalKey] || '·'}</div>
      <div class="body">
        <div class="say">${esc(Explore.describe(a, {
          experience: againstTimes ? `${expLabel} compared with ${otherLabel}` : expLabel }))}</div>
        <div class="why">${esc(sentenceJoin(a.strength.why, sig.caveat))}</div>
      </div>
      <span class="badge ${a.strength.key}">${esc(a.strength.label)}</span>
    </div>`;
  }).join('') : `<div class="card note">None of the loaded sits carry a signal this question can be
    answered with.</div>`;

  host.innerHTML = `<h2>What do you want to understand?</h2>
    <div class="card">
      <div class="askRow">
        <select id="qSel">${questionOptions}</select>
        <button id="qGo">Explore</button>
      </div>
      <div class="knobs">
        <label>Experience <select id="expSel">${kindOptions}</select></label>
        ${q.key === 'between-marks' && otherKinds.length ? `<label>Compared with
          <select id="othSel">${otherKinds.map((k) => `<option value="${esc(k.kind)}"`
            + `${k.kind === exploreState.other ? ' selected' : ''}>${esc(k.label)}`
            + ` · ${k.total} marks</option>`).join('')}</select></label>`
          : '<span class="dim">compared with the rest of each sit</span>'}
        <label>Window <select id="winSel">
          ${[10, 20, 30, 60].map((v) => `<option value="${v}"`
            + `${v === exploreState.windowSec ? ' selected' : ''}>${v} seconds</option>`).join('')}
        </select></label>
        <span class="dim">${usable.length} session${usable.length === 1 ? '' : 's'} loaded</span>
      </div>
    </div>
    <div class="split">
      <div>
        ${missingComparable}
        <div class="card">
          <div class="sideHead">What the data suggests</div>
          ${findings}
          <div class="note" style="margin-top:12px">Association, not proof. Every line above is a
          description of a handful of recordings from one person, and a signal can move with a state
          without being caused by it.</div>
        </div>
        <div class="card">
          <div class="sideHead">Try next</div>
          <div style="line-height:1.6">${esc(Explore.nextStep(answers, usable))}</div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="sideHead">How to read this</div>
          <div class="keyRow"><span class="k"><span class="badge repeats">Repeats</span></span>
            <span>The same direction in at least three quarters of the sits that could answer, and at
            least three of them.</span></div>
          <div class="keyRow"><span class="k"><span class="badge possible">Possible</span></span>
            <span>More sits agreed than disagreed, but not by enough to rule out where you happened to
            look.</span></div>
          <div class="keyRow"><span class="k"><span class="badge unclear">Unclear</span></span>
            <span>The sits disagree about the direction. That is what no pattern looks like.</span></div>
          <div class="keyRow"><span class="k"><span class="badge insufficient">Not enough</span></span>
            <span>Fewer than ${Explore.MIN_SESSIONS} sits could answer. Not the same as no
            effect.</span></div>
        </div>
        <div class="card">
          <div class="sideHead">Why a count, not a p-value</div>
          <div style="font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.66)">
            A p-value over marks pooled from every sit assumes the sits are interchangeable. They are
            not — they differ in electrode fit, time of day, and how much signal was usable. Here each
            sit votes once, however many marks it holds, so one sit with forty marks cannot outvote
            five with five. And a count degrades honestly: <em>2 of 2</em> plainly looks small, where
            <em>p = 0.03</em> from two sits looks identical to one from twenty.
          </div>
        </div>
      </div>
    </div>`;

  const qSel = document.getElementById('qSel');
  const expSel = document.getElementById('expSel');
  const winSel = document.getElementById('winSel');
  if (qSel) qSel.addEventListener('change', () => { exploreState.question = qSel.value; renderExplore(); });
  if (expSel) expSel.addEventListener('change', () => { exploreState.experience = expSel.value; renderExplore(); });
  const othSel = document.getElementById('othSel');
  if (othSel) othSel.addEventListener('change', () => { exploreState.other = othSel.value; renderExplore(); });
  if (winSel) winSel.addEventListener('change', () => {
    exploreState.windowSec = Number(winSel.value); renderExplore();
  });
  const go = document.getElementById('qGo');
  if (go) go.addEventListener('click', () => renderExplore());
}
