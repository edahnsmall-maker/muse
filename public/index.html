<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Muse Zen Spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 5vmin; }
  .status { align-self: center; color: rgba(255,255,255,.85); font-size: 15px;
    letter-spacing: .04em; text-align: center; text-shadow: 0 1px 12px rgba(0,0,0,.6);
    background: rgba(0,0,0,.28); padding: 10px 18px; border-radius: 999px;
    backdrop-filter: blur(6px); transition: opacity .6s; }
  .status.hidden { opacity: 0; }
  #hud { align-self: flex-start; color: rgba(255,255,255,.55); font-size: 12px;
    font-variant-numeric: tabular-nums; line-height: 1.7; text-shadow: 0 1px 8px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .4s; }
  #hud.show { opacity: 1; }
  #hint { align-self: center; color: rgba(255,255,255,.4); font-size: 12px; letter-spacing: .05em; }
  kbd { background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="overlay">
  <div id="hud"></div>
  <div class="status" id="status">connecting…</div>
  <div id="hint">press <kbd>D</kbd> for readout · <kbd>F</kbd> for fullscreen ·
    <a href="direct.html" style="color:inherit">no phone? try direct Bluetooth →</a></div>
</div>
<script src="viz-core.js"></script>
<script src="visual.js"></script>
<script>
const visual = createZenVisual(document.getElementById('gl'));
let last = {};

// ---- WebSocket ----------------------------------------------------------
const statusEl=document.getElementById('status'), hudEl=document.getElementById('hud');
let showHud=false;
addEventListener('keydown', e=>{
  if(e.key==='d'||e.key==='D'){ showHud=!showHud; hudEl.classList.toggle('show', showHud); }
  if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
function setStatus(txt, hide){ statusEl.textContent=txt; statusEl.classList.toggle('hidden', !!hide); }
function connect(){
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => setStatus('put on your Muse — checking contact…');
  ws.onclose = () => { setStatus('disconnected — retrying…'); setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data); last = m;
    if (typeof m.calm === 'number') visual.setCalm(m.calm);
    if (!m.haveData) setStatus('waiting for Muse data — is Mind Monitor streaming?');
    else if (!m.contactOk) setStatus('adjust the headband — poor contact');
    else setStatus('', true);                    // good data → fade the message away
    if (showHud) hudEl.innerHTML =
      `calm&nbsp;&nbsp;${(m.calm*100).toFixed(0)}%<br>` +
      `α/β&nbsp;&nbsp;&nbsp;&nbsp;${m.ratio==null?'—':m.ratio.toFixed(3)}<br>` +
      `contact&nbsp;${m.contactOk?'ok':'poor'}<br>` +
      `${m.blink?'blink ':''}${m.jaw?'jaw':''}`;
  };
}
connect();
</script>
</body>
</html>
