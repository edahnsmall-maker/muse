<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Muse Zen Spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 5vmin; }
  .status { align-self: center; color: rgba(255,255,255,.85); font-size: 15px;
    letter-spacing: .04em; text-align: center; text-shadow: 0 1px 12px rgba(0,0,0,.6);
    background: rgba(0,0,0,.28); padding: 10px 18px; border-radius: 999px;
    backdrop-filter: blur(6px); transition: opacity .6s; }
  .status.hidden { opacity: 0; }
  #hud { align-self: flex-start; color: rgba(255,255,255,.55); font-size: 12px;
    font-variant-numeric: tabular-nums; line-height: 1.7; text-shadow: 0 1px 8px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .4s; }
  #hud.show { opacity: 1; }
  #hint { align-self: center; color: rgba(255,255,255,.4); font-size: 12px; letter-spacing: .05em; }
  kbd { background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="overlay">
  <div id="hud"></div>
  <div class="status" id="status">connecting…</div>
  <div id="hint">press <kbd>D</kbd> for readout · <kbd>F</kbd> for fullscreen</div>
</div>
<script>
// ---- WebGL setup --------------------------------------------------------
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');
const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 u_res; uniform float u_time; uniform float u_calm;
float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
float fbm(vec2 p){ float v=0.0, amp=0.5; for(int i=0;i<5;i++){ v+=amp*noise(p); p*=2.02; amp*=0.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / u_res.xy;
  vec2 p = uv; p.x *= u_res.x / u_res.y;
  float speed = mix(0.34, 0.06, u_calm);
  float warp  = mix(1.7, 0.55, u_calm);
  float t = u_time * speed;
  vec2 q = vec2(fbm(p*warp + vec2(0.0, t)), fbm(p*warp + vec2(5.2, -t)));
  float n = fbm(p*warp*1.5 + q*1.5 + t*0.5);
  vec3 coolA=vec3(0.04,0.06,0.11), coolB=vec3(0.18,0.30,0.47), coolC=vec3(0.42,0.28,0.55);
  vec3 warmA=vec3(0.10,0.06,0.08), warmB=vec3(0.86,0.55,0.30), warmC=vec3(0.96,0.82,0.58);
  vec3 cool = mix(coolA, mix(coolB,coolC, smoothstep(0.4,0.9,n)), smoothstep(0.1,0.7,n));
  vec3 warm = mix(warmA, mix(warmB,warmC, smoothstep(0.4,0.95,n)), smoothstep(0.1,0.7,n));
  vec3 col = mix(cool, warm, smoothstep(0.0,1.0,u_calm));
  float contrast = mix(1.25, 0.9, u_calm);
  col = (col-0.5)*contrast + 0.5;
  float period = mix(6.0, 11.0, u_calm);        // breathing luminance slows as you settle
  float breath = 0.5 + 0.5*sin(u_time*6.2831853/period);
  col *= mix(1.0, 0.9 + 0.18*breath, 0.6);
  float d = distance(uv, vec2(0.5));
  col *= 1.0 - 0.35*d*d;                          // soft vignette
  gl_FragColor = vec4(col, 1.0);
}`;
function compile(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRes=gl.getUniformLocation(prog,'u_res'), uTime=gl.getUniformLocation(prog,'u_time'), uCalm=gl.getUniformLocation(prog,'u_calm');
function resize(){ const dpr=Math.min(devicePixelRatio||1, 2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; gl.viewport(0,0,canvas.width,canvas.height); }
addEventListener('resize', resize); resize();

// ---- state + render loop -----------------------------------------------
let calm = 0.5, targetCalm = 0.5, last = {};
const start = performance.now();
function frame(now){
  calm += 0.06*(targetCalm - calm);              // extra client-side smoothing
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, (now-start)/1000);
  gl.uniform1f(uCalm, calm);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- WebSocket ----------------------------------------------------------
const statusEl=document.getElementById('status'), hudEl=document.getElementById('hud');
let showHud=false;
addEventListener('keydown', e=>{
  if(e.key==='d'||e.key==='D'){ showHud=!showHud; hudEl.classList.toggle('show', showHud); }
  if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
function setStatus(txt, hide){ statusEl.textContent=txt; statusEl.classList.toggle('hidden', !!hide); }
function connect(){
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => setStatus('put on your Muse — checking contact…');
  ws.onclose = () => { setStatus('disconnected — retrying…'); setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data); last = m;
    if (typeof m.calm === 'number') targetCalm = m.calm;
    if (!m.haveData) setStatus('waiting for Muse data — is Mind Monitor streaming?');
    else if (!m.contactOk) setStatus('adjust the headband — poor contact');
    else setStatus('', true);                    // good data → fade the message away
    if (showHud) hudEl.innerHTML =
      `calm&nbsp;&nbsp;${(m.calm*100).toFixed(0)}%<br>` +
      `α/β&nbsp;&nbsp;&nbsp;&nbsp;${m.ratio==null?'—':m.ratio.toFixed(3)}<br>` +
      `contact&nbsp;${m.contactOk?'ok':'poor'}<br>` +
      `${m.blink?'blink ':''}${m.jaw?'jaw':''}`;
  };
}
connect();
</script>
</body>
</html>
